<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Güncel Market Bültenleri</title>
  <style>
    :root { --red:#e30613; --blue:#08a9dc; --ink:#16181d; --line:#e7e8eb; --muted:#69707c; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#f3f4f6; color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    button { font:inherit; }
    .market-nav { position:sticky; top:0; z-index:30; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:max(10px,env(safe-area-inset-top)) 12px 10px; background:#fffffff2; border-bottom:3px solid var(--red); box-shadow:0 4px 12px #0002; backdrop-filter:blur(10px); }
    .market-button { position:relative; min-width:0; aspect-ratio:1; max-height:92px; padding:4px; border:3px solid #d8dbe0; border-radius:50%; background:#fff; font-size:22px; font-weight:900; cursor:pointer; box-shadow:0 4px 10px #0002, inset 0 0 0 3px #fff; transition:transform .18s ease; }
    .market-button:active { transform:scale(.94); }
    .market-button.has-new { border-color:transparent; background:linear-gradient(#fff,#fff) padding-box, conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75) border-box; animation:ringPulse 1.8s ease-in-out infinite; }
    .story-count { position:absolute; right:-3px; bottom:1px; display:grid; min-width:23px; height:23px; padding:0 5px; place-items:center; border:2px solid #fff; border-radius:999px; background:var(--red); color:#fff; font-size:11px; line-height:1; }
    @keyframes ringPulse { 50% { box-shadow:0 5px 16px #d6297655, inset 0 0 0 3px #fff; } }
    .market-button[data-market=A101] { color:#12a9a4; }
    .market-button[data-market=BIM] { color:#e30613; }
    .market-button[data-market=SOK] { color:#15549a; }
    #content { max-width:760px; min-height:60vh; margin:auto; background:#fff; }
    .status { padding:48px 18px; color:var(--muted); text-align:center; }
    .retry { margin-top:14px; padding:10px 16px; border:0; border-radius:12px; background:var(--red); color:#fff; font-weight:700; }
    .row { padding:9px 0 16px; border-bottom:3px solid var(--line); background:linear-gradient(180deg,#fff 0%,#fafbfc 100%); }
    .row-title { margin:0 12px 6px; text-align:center; font-size:16px; font-weight:800; }
    .strip { display:flex; gap:14px; overflow-x:auto; padding:3px 14px 12px; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-inline:contain; }
    .strip::-webkit-scrollbar { display:none; }
    .card { flex:0 0 clamp(145px,43vw,220px); margin:0; padding:7px 7px 0; border:1px solid #d8dbe1; border-radius:10px; background:linear-gradient(145deg,#fff,#eceef2); color:inherit; text-align:center; cursor:pointer; scroll-snap-align:start; box-shadow:5px 7px 12px #1d263526, -2px -2px 5px #fff, inset 0 1px 0 #fff; transform:perspective(700px) rotateY(-.7deg); transition:transform .18s ease,box-shadow .18s ease; }
    .card:active { transform:perspective(700px) rotateY(0) translateY(2px) scale(.985); box-shadow:2px 3px 6px #1d263528; }
    .card-media { position:relative; display:grid; width:100%; aspect-ratio:3/4; place-items:center; overflow:hidden; border:1px solid #e1e3e7; background:#fff; border-radius:6px; box-shadow:inset 0 0 12px #0000000b; }
    .card img { width:100%; height:100%; display:block; object-fit:contain; }
    .card-label { display:block; min-height:55px; padding:8px 2px 7px; font-size:13px; line-height:1.18; font-weight:800; text-shadow:0 1px 0 #fff; }
    .card-date { display:block; min-height:26px; margin-top:4px; color:#343943; font-size:11px; line-height:1.18; font-weight:700; }
    .card-date.reading { color:#858b95; font-weight:500; }
    .ad-wrap { padding:15px 10px; border-bottom:3px solid var(--line); background:#f7f7f8; }
    .ad-slot { display:flex; width:min(300px,100%); height:250px; margin:auto; align-items:center; justify-content:center; border:1px dashed #c6c9cf; background:#fff; color:#9a9faa; font-size:12px; text-align:center; }
    .ad-slot.native-ready { border:0; color:transparent; }
    .reader { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; background:radial-gradient(circle at 50% 35%,#2b3039 0,#101216 65%); color:#fff; }
    .reader[hidden] { display:none; }
    .reader-bar { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; min-height:58px; padding-top:env(safe-area-inset-top); background:#181b20; }
    .story-mode .reader-bar { background:linear-gradient(180deg,#090a0ddd,#181b20); }
    .reader-bar button { height:44px; border:0; background:transparent; color:#fff; font-size:27px; cursor:pointer; }
    .reader-title { overflow:hidden; text-align:center; font-size:16px; font-weight:800; text-overflow:ellipsis; white-space:nowrap; }
    .reader-pages { display:flex; flex:1; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; touch-action:pan-x; }
    .reader-pages.zoom-lock { overflow-x:hidden; scroll-snap-type:none; touch-action:none; }
    .reader-pages::-webkit-scrollbar { display:none; }
    .page { flex:0 0 100%; display:grid; place-items:center; padding:8px; scroll-snap-align:start; scroll-snap-stop:always; }
    .page img { max-width:100%; max-height:100%; object-fit:contain; border-radius:4px; box-shadow:0 5px 24px #000b; transform-origin:center; will-change:transform,opacity,filter; }
    .story-mode .page.active img { animation:storyAppear .38s ease-out both; }
    .story-mode .page.zoomed img { animation:none; }
    @keyframes storyAppear { from { opacity:.25; filter:brightness(.82) blur(1px); } to { opacity:1; filter:brightness(1) blur(0); } }
    .reader-footer { min-height:42px; padding:11px 12px max(11px,env(safe-area-inset-bottom)); background:#181b20; color:#e5e7eb; text-align:center; font-size:14px; }
    .story-progress { display:flex; gap:3px; padding:8px 8px 5px; background:#181b20; filter:drop-shadow(0 2px 2px #0007); }
    .story-progress[hidden] { display:none; }
    .story-track { flex:1; height:4px; overflow:hidden; border-radius:8px; background:#ffffff42; box-shadow:inset 0 1px 2px #0005; }
    .story-fill { display:block; width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,#fff,#f2f2f2); box-shadow:0 0 5px #fff9; will-change:width; }
    .story-track.done .story-fill { width:100%; }
    .story-track.active .story-fill { box-shadow:0 0 7px #fff; }
    .toast { position:fixed; z-index:150; left:50%; bottom:28px; translate:-50% 0; padding:11px 16px; border-radius:99px; background:#16181de8; color:#fff; font-size:13px; box-shadow:0 4px 15px #0005; animation:toastLife 2.3s both; }
    @keyframes toastLife { 0%,100% { opacity:0; transform:translateY(8px); } 12%,82% { opacity:1; transform:none; } }
    .noscript { margin:20px; color:#b00020; }
    @media (min-width:600px) { .market-nav { max-width:520px; margin:auto; } .card { flex-basis:205px; } }
  </style>
</head>
<body>
  <nav class="market-nav" aria-label="Marketler">

  <script>
  (() => {
    'use strict';

    const HOME_MANIFEST = 'https://oeappstudio.com/Brochures/Manifest/manifest.txt';
    const MARKET_MANIFESTS = Object.freeze({
      A101: 'https://oeappstudio.com/Brochures/Brochures/A101/manifest.txt',

    });
    const ADS_AFTER_ROWS = Object.freeze({

      4: 'ca-app-pub-3899323845108149/9961222634',
      5: 'ca-app-pub-3899323845108149/2704632847'
    });
    // Ana manifestteki doğrulanmış broşür tarihleri. Bu görsellerde tarih
    // kart oluşturulurken anında gösterilir; telefonda OCR beklenmez.
    const INSTANT_DATES = Object.freeze({
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_6qFn0nf55N_2048x2048.webp':'27 AĞUSTOS PERŞEMBE',
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_GrpnKM0cTp_2048x2048.webp':'27 AĞUSTOS PERŞEMBE',
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_qxn9vnNgYg_2048x2048.webp':'27 AĞUSTOS PERŞEMBE',
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_BUlnj66AW5_2048x2048.webp':'24 AĞUSTOS',
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_ehxYTMKgnX_2048x2048.webp':'27 AĞUSTOS PERŞEMBE',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_004.webp?v=20260825122353':'1 EYLÜL’DEN İTİBAREN',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_017.webp?v=20260825122353':'30 AĞUSTOS’TAN İTİBAREN',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_011.webp?v=20260825122353':'25 AĞUSTOS’TAN İTİBAREN',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_020.webp?v=20260825122353':'30 AĞUSTOS’TAN İTİBAREN',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_019.webp?v=20260825122353':'28 AĞUSTOS’TAN İTİBAREN',
      'https://www.oeappstudio.com/Brochures/Brochures/SOK/TARIHSIZ/2026082011013148569_p13.webp':'22 AĞUSTOS – 15 EYLÜL 2026',
      'https://www.oeappstudio.com/Brochures/Brochures/SOK/TARIHSIZ/2026082011013148569_p15.webp':'22 AĞUSTOS – 15 EYLÜL 2026',
      'https://www.oeappstudio.com/Brochures/Brochures/SOK/TARIHSIZ/2026082011013148569_p18.webp':'22 AĞUSTOS – 15 EYLÜL 2026',
      'https://www.oeappstudio.com/Brochures/Brochures/SOK/TARIHSIZ/2026082011013148569_p09.webp':'22 AĞUSTOS – 15 EYLÜL 2026',
      'https://www.oeappstudio.com/Brochures/Brochures/SOK/TARIHSIZ/2026082011013148569_p01.webp':'19 – 25 AĞUSTOS 2026',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_002.webp?v=20260825122353':'30 AĞUSTOS’TAN İTİBAREN',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_018.webp?v=20260825122353':'25 AĞUSTOS’TAN İTİBAREN',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_005.webp?v=20260825122353':'22 – 28 AĞUSTOS',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_007.webp?v=20260825122353':'1 EYLÜL’DEN İTİBAREN',
      'https://www.oeappstudio.com/Brochures/Brochures/BIM/afisler.aspxtop1Bim_AfisKey992_009.webp?v=20260825122353':'4 – 31 AĞUSTOS',
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_fCt2yigPhl_2048x2048.webp':'27 AĞUSTOS PERŞEMBE',
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_uS0r3R8V5r_2048x2048.webp':'24 AĞUSTOS',
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_JVLWkYH2Zn_2048x2048.webp':'24 AĞUSTOS',
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_HrOkfNrByO_2048x2048.webp':'27 AĞUSTOS PERŞEMBE',
      'https://www.oeappstudio.com/Brochures/Brochures/A101/yedek_aldin-aldin-gelecek-hafta/aldin-aldin-gelecek-hafta_PqcZhp76su_2048x2048.webp':'27 AĞUSTOS PERŞEMBE'
    });
    const ITEMS_PER_ROW = 5;

    const content = document.querySelector('#content');
    const reader = document.querySelector('#reader');
    const readerPages = document.querySelector('#readerPages');
    const readerTitle = document.querySelector('#readerTitle');
    const readerCounter = document.querySelector('#readerCounter');
    const storyProgress = document.querySelector('#storyProgress');
    let activeReaderUrls = [];
    let previousOverflow = '';
    let storyMarket = null;
    let storyFrame = 0;
    let storyElapsed = 0;
    let storyLastTick = 0;
    let storyHolding = false;
    let longPressTimer = 0;
    let longPressActive = false;
    let longPressX = 0;
    let longPressY = 0;
    let suppressStoryClickUntil = 0;
    let currentReaderIndex = 0;
    const STORY_DURATION = 5000;
    const zoomState = { page:null, image:null, scale:1, x:0, y:0, mode:null, startDistance:0, startScale:1, startX:0, startY:0, baseX:0, baseY:0 };
    const SEEN_KEY = 'oeapp_seen_brochures_v2';
    // v2: A101 ve ŞOK için markete özel tarih bölgeleri kullanılır.
    const OCR_CACHE_KEY = 'oeapp_brochure_dates_v2';
    const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    const marketCache = { A101:[], BIM:[], SOK:[] };
    const ocrQueue = [];
    let ocrBusy = false;
    let ocrWorkerPromise = null;

    function marketFromUrl(url) {
      const path = String(url).toUpperCase();
      if (path.includes('/A101/')) return 'A101';
      if (path.includes('/BIM/')) return 'BIM';
      if (path.includes('/SOK/')) return 'SOK';
      return null;
    }

    function marketLabel(market) { return market === 'BIM' ? 'BİM' : market === 'SOK' ? 'ŞOK' : 'A101'; }

    async function getManifest(url) {
      const separator = url.includes('?') ? '&' : '?';
      const response = await fetch(url + separator + '_=' + Date.now(), { cache:'no-store' });
      if (!response.ok) throw new Error('Manifest alınamadı: HTTP ' + response.status);
      const text = (await response.text()).replace(/^\uFEFF/, '');
      const urls = text.split(/\r?\n/).map(v => v.trim()).filter(v => /^https?:\/\//i.test(v));
      if (!urls.length) throw new Error('Manifestte geçerli görsel bağlantısı yok.');
      return [...new Set(urls)];
    }

    function createCard(url, market, index) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'card';
      button.setAttribute('aria-label', marketLabel(market) + ' broşürünü aç');
      const media = document.createElement('span');
      media.className = 'card-media';
      const image = document.createElement('img');
      image.src = url;
      image.alt = marketLabel(market) + ' aktüel ürünler broşürü';
      image.loading = index < 5 ? 'eager' : 'lazy';
      image.decoding = 'async';
      image.referrerPolicy = 'no-referrer';
      image.addEventListener('error', () => { media.style.background = '#eceef1'; image.alt = 'Görsel yüklenemedi'; });
      const label = document.createElement('span');
      label.className = 'card-label';
      const marketName = document.createElement('span');
      marketName.textContent = marketLabel(market);
      const date = document.createElement('span');
      date.className = 'card-date reading';
      date.textContent = 'Tarih okunuyor…';
      date.dataset.ocrUrl = url;
      label.append(marketName, date);
      media.append(image);
      button.append(media, label);
      button.addEventListener('click', () => openReader(market, url));
      observeDate(date);
      return button;
    }

    function getOcrCache() {
      try { return JSON.parse(localStorage.getItem(OCR_CACHE_KEY)) || {}; } catch (_) { return {}; }
    }

    function saveOcrDate(url, value) {
      const cache = getOcrCache();
      cache[url] = value;
      const entries = Object.entries(cache).slice(-250);
      try { localStorage.setItem(OCR_CACHE_KEY, JSON.stringify(Object.fromEntries(entries))); } catch (_) {}
    }

    const dateObserver = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        dateObserver.unobserve(entry.target);
        enqueueOcr(entry.target);
      });
    }, { rootMargin:'220px' }) : null;

    function observeDate(element) {
      const instant = INSTANT_DATES[element.dataset.ocrUrl];
      if (instant) { setDateText(element, instant); return; }
      const cached = getOcrCache()[element.dataset.ocrUrl];
      if (cached) { setDateText(element, cached); return; }
      if (dateObserver) dateObserver.observe(element); else enqueueOcr(element);
    }

    function enqueueOcr(element) {
      if (!element?.isConnected || element.dataset.queued) return;
      element.dataset.queued = '1';
      ocrQueue.push(element);
      processOcrQueue();
    }

    async function processOcrQueue() {
      if (ocrBusy) return;
      ocrBusy = true;
      while (ocrQueue.length) {
        const element = ocrQueue.shift();
        if (!element?.isConnected) continue;
        const url = element.dataset.ocrUrl;
        try {
          const text = await recognizeBrochureDate(url);
          const label = extractDateLabel(text);
          if (label) saveOcrDate(url, label);
          setDateText(element, label || 'Tarih okunamadı');
        } catch (error) {
          setDateText(element, 'Tarih okunamadı');
          console.warn('Broşür tarihi okunamadı:', error);
        }
      }
      ocrBusy = false;
    }

    function setDateText(element, value) {
      element.textContent = value;
      element.classList.remove('reading');
    }

    function loadTesseract() {
      if (window.Tesseract) return Promise.resolve(window.Tesseract);
      return new Promise((resolve,reject) => {
        const old = document.querySelector('script[data-tesseract]');
        if (old) { old.addEventListener('load', () => resolve(window.Tesseract), { once:true }); old.addEventListener('error', reject, { once:true }); return; }
        const script = document.createElement('script');
        script.src = TESSERACT_URL;
        script.async = true;
        script.dataset.tesseract = '1';
        script.onload = () => resolve(window.Tesseract);
        script.onerror = () => reject(new Error('OCR kütüphanesi yüklenemedi'));
        document.head.append(script);
      });
    }

    async function getOcrWorker() {
      if (!ocrWorkerPromise) ocrWorkerPromise = (async () => {
        const Tesseract = await loadTesseract();
        // Tarihler rakam ve ay adlarından oluştuğu için hafif İngilizce model
        // yeterlidir; Türkçe karakterlerin aksansız biçimleri de eşleştirilir.
        return Tesseract.createWorker('eng');
      })();
      return ocrWorkerPromise;
    }

    async function imageForOcr(url) {
      const image = new Image();
      image.crossOrigin = 'anonymous';
      image.referrerPolicy = 'no-referrer';
      image.decoding = 'async';
      image.src = url;
      await image.decode();
      const sourceWidth = image.naturalWidth;
      const sourceHeight = image.naturalHeight;
      const market = marketFromUrl(url);
      let regions;

      if (market === 'A101') {
        // A101 tarih bilgisi broşürün sağ üst bölümünde bulunur.
        regions = [{ x:.42, y:0, w:.58, h:.34 }];
      } else if (market === 'SOK') {
        // ŞOK tarih bilgisi broşürün üst-orta bölümünde bulunur.
        regions = [{ x:.08, y:0, w:.84, h:.30 }];
      } else {
        // BİM'de mevcut çalışan yöntem: üst ve alt başlık alanları.
        regions = [
          { x:0, y:0, w:1, h:.34 },
          { x:0, y:.66, w:1, h:.34 }
        ];
      }

      const widestSource = Math.max(...regions.map(r => sourceWidth * r.w));
      const targetWidth = Math.min(820, Math.round(widestSource));
      const gap = regions.length > 1 ? 14 : 0;
      const scaledHeights = regions.map(r => Math.max(1, Math.round(sourceHeight * r.h * targetWidth / (sourceWidth * r.w))));
      const canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = scaledHeights.reduce((total,height) => total + height,0) + gap;
      const ctx = canvas.getContext('2d', { alpha:false });
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.filter = 'grayscale(1) contrast(1.45)';
      let targetY = 0;
      regions.forEach((region,index) => {
        const height = scaledHeights[index];
        ctx.drawImage(
          image,
          Math.round(sourceWidth * region.x), Math.round(sourceHeight * region.y),
          Math.round(sourceWidth * region.w), Math.round(sourceHeight * region.h),
          0, targetY, targetWidth, height
        );
        targetY += height + gap;
      });
      return canvas;
    }

    async function recognizeBrochureDate(url) {
      const worker = await getOcrWorker();
      const canvas = await imageForOcr(url);
      const result = await worker.recognize(canvas);
      return result?.data?.text || '';
    }

    function extractDateLabel(rawText) {
      const months = 'OCAK|ŞUBAT|SUBAT|MART|NİSAN|NISAN|MAYIS|HAZİRAN|HAZIRAN|TEMMUZ|AĞUSTOS|AGUSTOS|EYLÜL|EYLUL|EKİM|EKIM|KASIM|ARALIK';
      const cleaned = String(rawText).toLocaleUpperCase('tr-TR').replace(/[|]/g,'I').replace(/\s+/g,' ').trim();
      const patterns = [
        new RegExp('\\b\\d{1,2}\\s+(?:' + months + ')\\s*[-–—/]\\s*\\d{1,2}\\s+(?:' + months + ')(?:\\s+TARİHLERİ?\\s+ARASI)?','i'),
        new RegExp('\\b\\d{1,2}\\s+(?:' + months + ')(?:\\s+\\d{4})?\\s+(?:TARİHİNDEN|TARİHİ|İTİBAREN)','i'),
        new RegExp('\\b\\d{1,2}[./-]\\d{1,2}(?:[./-]\\d{2,4})?\\s*[-–—]\\s*\\d{1,2}[./-]\\d{1,2}(?:[./-]\\d{2,4})?','i'),
        new RegExp('\\b\\d{1,2}\\s+(?:' + months + ')(?:\\s+\\d{4})?','i')
      ];
      for (const pattern of patterns) {
        const match = cleaned.match(pattern);
        if (match) return match[0].replace(/\s+/g,' ').trim();
      }
      return '';
    }

    function createAd(rowNumber, unitId) {
      const wrap = document.createElement('section');
      wrap.className = 'ad-wrap';
      const slot = document.createElement('div');
      slot.className = 'ad-slot';
      slot.id = 'ad-slot-' + rowNumber;
      slot.dataset.adUnitId = unitId;
      slot.dataset.adSize = 'MEDIUM_RECTANGLE';
      slot.textContent = 'Reklam';
      wrap.append(slot);
      requestAnimationFrame(() => announceAdSlot(slot, rowNumber));
      return wrap;
    }

    function announceAdSlot(slot, rowNumber) {
      const detail = { action:'SHOW_AD', slotId:slot.id, row:rowNumber, adUnitId:slot.dataset.adUnitId, size:'MEDIUM_RECTANGLE' };
      window.dispatchEvent(new CustomEvent('oeapp:ad-slot-ready', { detail }));
      try {
        if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
          window.AppInventor.setWebViewString(JSON.stringify(detail));
          slot.classList.add('native-ready');
        }
      } catch (_) { /* Tarayıcı önizlemesinde native köprü bulunmaz. */ }
    }

    function renderHome(urls) {
      content.replaceChildren();
      const rows = [];
      for (let start = 0; start < urls.length; start += ITEMS_PER_ROW) rows.push(urls.slice(start, start + ITEMS_PER_ROW));

      rows.forEach((rowUrls, rowIndex) => {
        const market = marketFromUrl(rowUrls[0]);
        const section = document.createElement('section');
        section.className = 'row';
        const title = document.createElement('h2');
        title.className = 'row-title';
        title.textContent = market ? marketLabel(market) : 'Güncel Broşürler';
        const strip = document.createElement('div');
        strip.className = 'strip';
        rowUrls.forEach((url, itemIndex) => strip.append(createCard(url, marketFromUrl(url) || market || 'A101', rowIndex * ITEMS_PER_ROW + itemIndex)));
        section.append(title, strip);
        content.append(section);
        const rowNumber = rowIndex + 1;
        if (ADS_AFTER_ROWS[rowNumber]) content.append(createAd(rowNumber, ADS_AFTER_ROWS[rowNumber]));
      });
    }

    async function openReader(market, clickedUrl) {
      if (!MARKET_MANIFESTS[market]) return;
      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      reader.hidden = false;
      reader.classList.remove('story-mode');
      storyProgress.hidden = true;
      storyMarket = null;
      cancelAnimationFrame(storyFrame);
      readerTitle.textContent = marketLabel(market) + ' Broşürü';
      readerPages.innerHTML = '<div class="status">Broşür yükleniyor…</div>';
      readerCounter.textContent = 'Yükleniyor…';
      try {
        const allUrls = await getManifest(MARKET_MANIFESTS[market]);
        activeReaderUrls = [clickedUrl, ...allUrls.filter(url => url !== clickedUrl)];
        readerPages.replaceChildren(...activeReaderUrls.map((url, index) => {
          const page = document.createElement('div');
          page.className = 'page';
          const image = document.createElement('img');
          image.src = url;
          image.alt = marketLabel(market) + ' broşür sayfası ' + (index + 1);
          image.loading = index < 2 ? 'eager' : 'lazy';
          image.decoding = 'async';
          image.referrerPolicy = 'no-referrer';
          page.append(image);
          return page;
        }));
        readerPages.scrollLeft = 0;
        updateCounter();
      } catch (error) {
        activeReaderUrls = [clickedUrl];
        readerPages.replaceChildren();
        const page = document.createElement('div');
        page.className = 'page';
        const image = document.createElement('img');
        image.src = clickedUrl;
        image.alt = marketLabel(market) + ' broşürü';
        page.append(image);
        readerPages.append(page);
        readerCounter.textContent = '1 / 1';
      }
    }

    function readSeen() {
      try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (_) { return {}; }
    }

    function markSeen(market, url) {
      if (!market || !url) return;
      const seen = readSeen();
      const list = new Set(Array.isArray(seen[market]) ? seen[market] : []);
      list.add(url);
      seen[market] = [...list].slice(-400);
      try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (_) {}
      updateStoryRing(market);
    }

    function unseenFor(market) {
      const seen = new Set(readSeen()[market] || []);
      return (marketCache[market] || []).filter(url => !seen.has(url));
    }

    function updateStoryRing(market) {
      const button = document.querySelector('.market-button[data-market="' + market + '"]');
      if (!button) return;
      const count = unseenFor(market).length;
      button.classList.toggle('has-new', count > 0);
      let badge = button.querySelector('.story-count');
      if (count > 0) {
        if (!badge) { badge = document.createElement('span'); badge.className = 'story-count'; button.append(badge); }
        badge.textContent = count > 99 ? '99+' : count;
        button.setAttribute('aria-label', marketLabel(market) + ': ' + count + ' yeni broşür');
      } else {
        if (badge) badge.remove();
        button.setAttribute('aria-label', marketLabel(market) + ': yeni broşür yok');
      }
    }

    async function refreshStories() {
      await Promise.all(Object.keys(MARKET_MANIFESTS).map(async market => {
        try { marketCache[market] = await getManifest(MARKET_MANIFESTS[market]); updateStoryRing(market); } catch (_) {}
      }));
    }

    function showToast(message) {
      document.querySelector('.toast')?.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.append(toast);
      setTimeout(() => toast.remove(), 2400);
    }

    async function openStory(market) {
      if (!marketCache[market].length) {
        try { marketCache[market] = await getManifest(MARKET_MANIFESTS[market]); } catch (error) { showError(error); return; }
      }
      const unseen = unseenFor(market);
      // Yeni içerik varsa Instagram gibi önce yeniler; tümü görüldüyse
      // marketin mevcut broşürleri yeniden oynatılır.
      const urls = unseen.length ? unseen : [...marketCache[market]];
      if (!urls.length) { showToast(marketLabel(market) + ' broşürü bulunamadı'); return; }
      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      storyMarket = market;
      activeReaderUrls = urls;
      currentReaderIndex = 0;
      reader.classList.add('story-mode');
      reader.classList.remove('story-paused');
      reader.hidden = false;
      readerTitle.textContent = '';
      storyProgress.hidden = false;
      storyProgress.replaceChildren(...urls.map(() => {
        const track = document.createElement('span'); track.className = 'story-track';
        const fill = document.createElement('span'); fill.className = 'story-fill'; track.append(fill); return track;
      }));
      readerPages.replaceChildren(...urls.map((url,index) => {
        const page = document.createElement('div'); page.className = 'page';
        const image = document.createElement('img'); image.src = url; image.alt = marketLabel(market) + ' yeni broşür ' + (index + 1); image.decoding = 'async'; image.loading = index < 2 ? 'eager' : 'lazy'; image.referrerPolicy = 'no-referrer';
        page.append(image); return page;
      }));
      readerPages.scrollLeft = 0;
      activateStory(0);
    }

    function activateStory(index) {
      if (!storyMarket || !activeReaderUrls.length) return;
      reader.classList.remove('story-paused');
      currentReaderIndex = Math.max(0, Math.min(index, activeReaderUrls.length - 1));
      [...readerPages.children].forEach((page,i) => page.classList.toggle('active', i === currentReaderIndex));
      // Smooth scroll burada scroll olayını tekrar tekrar tetikleyip sayacı
      // sıfırlıyordu. Konum anında değiştirilir; geçiş efektini görsel animasyonu verir.
      readerPages.scrollLeft = currentReaderIndex * readerPages.clientWidth;
      const tracks = [...storyProgress.children];
      tracks.forEach((track,i) => { track.className = 'story-track' + (i < currentReaderIndex ? ' done' : ''); });
      tracks[currentReaderIndex]?.classList.add('active');
      markSeen(storyMarket, activeReaderUrls[currentReaderIndex]);
      readerCounter.textContent = (currentReaderIndex + 1) + ' / ' + activeReaderUrls.length;
      const nextImage = readerPages.children[currentReaderIndex + 1]?.querySelector('img');
      if (nextImage) { nextImage.loading = 'eager'; nextImage.decode?.().catch(() => {}); }
      startStoryClock(true);
    }

    function currentStoryFill() {
      return storyProgress.children[currentReaderIndex]?.querySelector('.story-fill') || null;
    }

    function storyTick(now) {
      if (!storyMarket || reader.hidden || storyHolding || zoomState.scale > 1.01) return;
      storyElapsed += Math.max(0,now - storyLastTick);
      storyLastTick = now;
      const fill = currentStoryFill();
      const ratio = Math.min(1,storyElapsed / STORY_DURATION);
      if (fill) fill.style.width = (ratio * 100).toFixed(2) + '%';
      if (ratio >= 1) {
        if (currentReaderIndex < activeReaderUrls.length - 1) activateStory(currentReaderIndex + 1);
        else closeReader();
        return;
      }
      storyFrame = requestAnimationFrame(storyTick);
    }

    function startStoryClock(reset=false) {
      cancelAnimationFrame(storyFrame);
      const fill = currentStoryFill();
      if (!fill || !storyMarket) return;
      if (reset) storyElapsed = 0;
      fill.style.width = (Math.min(1,storyElapsed / STORY_DURATION) * 100).toFixed(2) + '%';
      storyHolding = false;
      reader.classList.remove('story-paused');
      storyLastTick = performance.now();
      storyFrame = requestAnimationFrame(storyTick);
    }

    function pauseStoryClock() {
      if (!storyMarket || storyHolding) return;
      cancelAnimationFrame(storyFrame);
      storyHolding = true;
      reader.classList.add('story-paused');
    }

    function resumeStoryClock() {
      if (!storyMarket || !storyHolding || reader.hidden || zoomState.scale > 1.01) return;
      startStoryClock(false);
    }

    function closeReader() {
      cancelAnimationFrame(storyFrame);
      clearTimeout(longPressTimer);
      storyHolding = false;
      longPressActive = false;
      resetZoom(false);
      reader.hidden = true;
      reader.classList.remove('story-mode');
      reader.classList.remove('story-paused');
      storyProgress.hidden = true;
      readerPages.replaceChildren();
      activeReaderUrls = [];
      storyMarket = null;
      document.body.style.overflow = previousOverflow;
    }

    function updateCounter() {
      if (zoomState.scale > 1.01) return;
      if (!activeReaderUrls.length) return;
      const index = Math.min(activeReaderUrls.length - 1, Math.max(0, Math.round(readerPages.scrollLeft / readerPages.clientWidth)));
      if (storyMarket) { if (index !== currentReaderIndex) activateStory(index); return; }
      readerCounter.textContent = (index + 1) + ' / ' + activeReaderUrls.length;
    }

    let counterFrame = 0;
    readerPages.addEventListener('scroll', () => {
      cancelAnimationFrame(counterFrame);
      counterFrame = requestAnimationFrame(updateCounter);
    }, { passive:true });
    document.querySelector('#closeReader').addEventListener('click', closeReader);

    function touchDistance(a,b) { return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY); }

    function activeZoomPage() {
      const index = Math.min(activeReaderUrls.length - 1, Math.max(0, Math.round(readerPages.scrollLeft / Math.max(1,readerPages.clientWidth))));
      return readerPages.children[index] || null;
    }

    function applyZoom() {
      if (!zoomState.image) return;
      zoomState.image.style.transform = 'translate3d(' + zoomState.x + 'px,' + zoomState.y + 'px,0) scale(' + zoomState.scale + ')';
    }

    function clampPan() {
      if (!zoomState.page || !zoomState.image) return;
      const maxX = Math.max(0,(zoomState.image.clientWidth * zoomState.scale - zoomState.page.clientWidth) / 2);
      const maxY = Math.max(0,(zoomState.image.clientHeight * zoomState.scale - zoomState.page.clientHeight) / 2);
      zoomState.x = Math.max(-maxX,Math.min(maxX,zoomState.x));
      zoomState.y = Math.max(-maxY,Math.min(maxY,zoomState.y));
    }

    function resetZoom(restartStory=true) {
      if (zoomState.image) zoomState.image.style.transform = '';
      if (zoomState.page) zoomState.page.classList.remove('zoomed');
      zoomState.page = null; zoomState.image = null; zoomState.scale = 1; zoomState.x = 0; zoomState.y = 0; zoomState.mode = null;
      readerPages.classList.remove('zoom-lock');
      if (restartStory && storyMarket && !reader.hidden) resumeStoryClock();
    }

    readerPages.addEventListener('touchstart', event => {
      if (event.touches.length === 2) {
        clearTimeout(longPressTimer);
        longPressActive = false;
        const page = activeZoomPage();
        const image = page?.querySelector('img');
        if (!page || !image) return;
        pauseStoryClock();
        zoomState.page = page; zoomState.image = image; zoomState.mode = 'pinch';
        zoomState.startDistance = Math.max(1,touchDistance(event.touches[0],event.touches[1]));
        zoomState.startScale = zoomState.scale;
        readerPages.classList.add('zoom-lock');
        page.classList.add('zoomed');
        event.preventDefault();
      } else if (event.touches.length === 1) {
        if (zoomState.scale > 1.01) {
          zoomState.mode = 'pan';
          zoomState.startX = event.touches[0].clientX; zoomState.startY = event.touches[0].clientY;
          zoomState.baseX = zoomState.x; zoomState.baseY = zoomState.y;
          event.preventDefault();
        } else if (storyMarket) {
          longPressX = event.touches[0].clientX;
          longPressY = event.touches[0].clientY;
          clearTimeout(longPressTimer);
          longPressTimer = setTimeout(() => {
            longPressActive = true;
            suppressStoryClickUntil = Date.now() + 600;
            pauseStoryClock();
            try { navigator.vibrate?.(12); } catch (_) {}
          },350);
        }
      }
    }, { passive:false });

    readerPages.addEventListener('touchmove', event => {
      if (event.touches.length === 1 && !longPressActive && longPressTimer) {
        const moved = Math.hypot(event.touches[0].clientX-longPressX,event.touches[0].clientY-longPressY);
        if (moved > 10) { clearTimeout(longPressTimer); longPressTimer = 0; }
      }
      if (longPressActive) { event.preventDefault(); return; }
      if (zoomState.mode === 'pinch' && event.touches.length >= 2) {
        zoomState.scale = Math.max(1,Math.min(4,zoomState.startScale * touchDistance(event.touches[0],event.touches[1]) / zoomState.startDistance));
        if (zoomState.scale <= 1.01) { zoomState.scale = 1; zoomState.x = 0; zoomState.y = 0; }
        clampPan(); applyZoom(); event.preventDefault();
      } else if (zoomState.scale > 1.01 && event.touches.length === 1) {
        zoomState.x = zoomState.baseX + event.touches[0].clientX - zoomState.startX;
        zoomState.y = zoomState.baseY + event.touches[0].clientY - zoomState.startY;
        clampPan(); applyZoom(); event.preventDefault();
      }
    }, { passive:false });

    readerPages.addEventListener('touchend', event => {
      clearTimeout(longPressTimer);
      longPressTimer = 0;
      if (longPressActive && event.touches.length === 0) {
        longPressActive = false;
        suppressStoryClickUntil = Date.now() + 600;
        resumeStoryClock();
        event.preventDefault();
        return;
      }
      if (event.touches.length >= 2) return;
      if (zoomState.scale <= 1.01) resetZoom();
      else if (event.touches.length === 1) {
        zoomState.mode = 'pan';
        zoomState.startX = event.touches[0].clientX; zoomState.startY = event.touches[0].clientY;
        zoomState.baseX = zoomState.x; zoomState.baseY = zoomState.y;
      } else zoomState.mode = null;
    }, { passive:false });
    readerPages.addEventListener('touchcancel', () => {
      clearTimeout(longPressTimer);
      longPressTimer = 0;
      if (longPressActive) { longPressActive = false; resumeStoryClock(); }
    }, { passive:false });
    readerPages.addEventListener('click', event => {
      if (!storyMarket || zoomState.scale > 1.01 || Date.now() < suppressStoryClickUntil) return;
      const ratio = event.clientX / Math.max(1,window.innerWidth);
      if (ratio < .34) activateStory(currentReaderIndex - 1);
      else if (ratio > .66) currentReaderIndex < activeReaderUrls.length - 1 ? activateStory(currentReaderIndex + 1) : closeReader();
    });
    document.querySelectorAll('.market-button').forEach(button => button.addEventListener('click', () => openStory(button.dataset.market)));
    window.addEventListener('popstate', () => { if (!reader.hidden) closeReader(); });

    function showError(error) {
      content.innerHTML = '';
      const status = document.createElement('div');
      status.className = 'status';
      status.append(document.createTextNode('Broşürler yüklenemedi. İnternet bağlantınızı kontrol edin.'));
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'retry';
      retry.textContent = 'Tekrar Dene';
      retry.addEventListener('click', loadHome);
      status.append(document.createElement('br'), retry);
      content.append(status);
      console.error(error);
    }

    async function loadHome() {
      content.innerHTML = '<div class="status">Broşürler yükleniyor…</div>';
      try { renderHome(await getManifest(HOME_MANIFEST)); refreshStories(); } catch (error) { showError(error); }
    }

    loadHome();
  })();
  </script>
</body>
</html>
