<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <title>Güncel Market Bültenleri</title>
  <script async
          src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3899323845108149"
          crossorigin="anonymous"></script>
  <style>
    :root { --red:#e30613; --blue:#08a9dc; --ink:#16181d; --line:#e7e8eb; --muted:#69707c; --market-nav-height:154px; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; overflow-x:clip; background:#f3f4f6; color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    body { padding-top:var(--market-nav-height); }
    button { font:inherit; }
    .market-nav { position:fixed; top:0; right:0; left:0; z-index:80; display:grid; width:100%; grid-template-columns:repeat(3,1fr); gap:9px 10px; padding:max(9px,env(safe-area-inset-top)) 12px 10px; background:#fff; border-bottom:3px solid var(--red); box-shadow:0 4px 12px #0002; contain:layout paint; transform:translateZ(0); }
    .all-markets-button { grid-column:1/-1; justify-self:center; min-width:190px; padding:9px 22px; border:1px solid #078db8; border-radius:999px; background:linear-gradient(145deg,#12b9eb,#079dce); color:#fff; font-size:13px; font-weight:900; letter-spacing:.35px; cursor:pointer; box-shadow:0 4px 9px #078db842,inset 0 1px 0 #ffffff80; transition:transform .16s ease,box-shadow .16s ease; }
    .all-markets-button:active { transform:translateY(1px) scale(.98); }
    .all-markets-button.active { border-color:#056f93; box-shadow:0 0 0 3px #0aafd526,0 4px 10px #078db84d,inset 0 1px 0 #ffffff90; }
    .market-button { position:relative; min-width:0; aspect-ratio:1; max-height:92px; padding:4px; border:3px solid #d8dbe0; border-radius:50%; background:#fff; font-size:22px; font-weight:900; cursor:pointer; box-shadow:0 4px 10px #0002, inset 0 0 0 3px #fff; transition:transform .18s ease; }
    .market-button:active { transform:scale(.94); }
    .market-button.selected { border-color:var(--red); outline:3px solid #e30613; outline-offset:2px; box-shadow:0 0 0 3px #e3061324,0 5px 14px #0003,inset 0 0 0 3px #fff; }
    .market-button.has-new { border-color:transparent; background:linear-gradient(#fff,#fff) padding-box, conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75) border-box; }
    .story-count { position:absolute; right:-3px; bottom:1px; display:grid; min-width:23px; height:23px; padding:0 5px; place-items:center; border:2px solid #fff; border-radius:999px; background:var(--red); color:#fff; font-size:11px; line-height:1; }
    .market-button[data-market=A101] { color:#12a9a4; }
    .market-button[data-market=BIM] { color:#e30613; }
    .market-button[data-market=SOK] { color:#15549a; }
    #content { max-width:760px; min-height:60vh; margin:auto; background:#fff; }
    .status { padding:48px 18px; color:var(--muted); text-align:center; }
    .retry { margin-top:14px; padding:10px 16px; border:0; border-radius:12px; background:var(--red); color:#fff; font-weight:700; }
    .row { padding:9px 0 16px; border-bottom:3px solid var(--line); background:linear-gradient(180deg,#fff 0%,#fafbfc 100%); content-visibility:auto; contain-intrinsic-size:auto 390px; }
    .row-title { margin:0 12px 6px; text-align:center; font-size:16px; font-weight:800; }
    .strip { display:flex; gap:14px; overflow-x:auto; padding:3px 14px 12px; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-inline:contain; }
    .strip::-webkit-scrollbar { display:none; }
    .card { flex:0 0 clamp(145px,43vw,220px); min-width:0; margin:0; padding:7px 7px 0; border:1px solid #d8dbe1; border-radius:10px; background:linear-gradient(145deg,#fff,#eceef2); color:inherit; text-align:center; cursor:pointer; scroll-snap-align:start; box-shadow:5px 7px 12px #1d263526, -2px -2px 5px #fff, inset 0 1px 0 #fff; transition:box-shadow .18s ease; content-visibility:auto; contain-intrinsic-size:180px 320px; }
    #content.filtered-view .strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(142px,1fr)); gap:14px 11px; overflow:visible; padding:3px 12px 13px; scroll-snap-type:none; }
    #content.filtered-view .strip > .ad-wrap { grid-column:1/-1; width:100%; margin:2px 0; }
    #content.filtered-view .card { width:100%; min-width:0; flex:none; scroll-snap-align:none; }
    #content.filtered-view .selected-date-section { padding-top:12px; }
    #content.filtered-view .selected-date-section .row-title { margin:0 12px 10px; padding:10px 12px; border:1px solid #dfe4e8; border-radius:10px; background:#fff; text-align:left; box-shadow:0 2px 7px #1d263512; }
    #content.filtered-view .current-brochures .row-title { border-color:#b9e4d0; background:#f0fbf6; color:#087345; }
    #content.filtered-view .past-brochures { background:#f7f8fa; }
    #content.filtered-view .past-brochures .row-title { color:#5e6570; }
    #content.filtered-view .unknown-brochures .row-title { border-color:#f0d9a7; background:#fff9eb; color:#8a5b00; }
    .card:active { transform:translateY(2px) scale(.985); box-shadow:2px 3px 6px #1d263528; }
    .card-media { position:relative; display:grid; width:100%; aspect-ratio:var(--row-media-ratio,3/4); place-items:center; overflow:hidden; border:1px solid #e1e3e7; background:#fff; border-radius:6px; box-shadow:inset 0 0 12px #0000000b; }
    .card img { width:100%; height:100%; display:block; object-fit:contain; }
    .card-label { display:block; min-height:55px; padding:8px 2px 7px; font-size:13px; line-height:1.18; font-weight:800; text-shadow:0 1px 0 #fff; }
    .card-date { display:block; min-height:26px; margin-top:4px; color:#343943; font-size:11px; line-height:1.18; font-weight:700; }
    .card-date.reading { color:#858b95; font-weight:500; }
    .ad-wrap { padding:15px 10px; border-bottom:3px solid var(--line); background:#f7f7f8; }
    .ad-slot { display:flex; width:min(300px,100%); height:250px; margin:auto; align-items:center; justify-content:center; border:1px dashed #c6c9cf; background:#fff; color:#9a9faa; font-size:12px; text-align:center; }
    .ad-slot.native-ready { border:0; color:transparent; }
    .reader { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; background:radial-gradient(circle at 50% 35%,#2b3039 0,#101216 65%); color:#fff; }
    .reader[hidden] { display:none; }
    .reader-bar { display:grid; grid-template-columns:52px 1fr 52px; align-items:center; min-height:64px; padding:env(safe-area-inset-top) 4px 0; background:#181b20; }
    .story-mode .reader-bar { background:linear-gradient(180deg,#090a0ddd,#181b20); }
    .reader-bar button { display:grid; width:52px; height:52px; padding:0; place-items:center; border:0; border-radius:14px; background:transparent; color:#fff; font-size:36px; line-height:1; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    .reader-bar button:active { background:#ffffff18; transform:scale(.94); }
    .reader-title { overflow:hidden; text-align:center; font-size:16px; font-weight:800; text-overflow:ellipsis; white-space:nowrap; }
    .reader-pages { display:flex; flex:1; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; touch-action:pan-x; }
    .reader-pages.zoom-lock { overflow-x:hidden; scroll-snap-type:none; touch-action:none; }
    .reader-pages::-webkit-scrollbar { display:none; }
    .page { flex:0 0 100%; display:grid; place-items:center; padding:8px; scroll-snap-align:start; scroll-snap-stop:always; }
    .page img { max-width:100%; max-height:100%; object-fit:contain; border-radius:4px; box-shadow:0 5px 24px #000b; transform-origin:center; }
    .story-mode .reader-pages { background:#101216; }
    .story-mode .page { background:#101216; }
    .story-mode .page img { opacity:1; filter:none; transform:translateZ(0); -webkit-backface-visibility:hidden; backface-visibility:hidden; }
    .reader-footer { min-height:42px; padding:11px 12px max(11px,env(safe-area-inset-bottom)); background:#181b20; color:#e5e7eb; text-align:center; font-size:14px; }
    .story-progress { display:flex; gap:3px; padding:8px 8px 5px; background:#181b20; filter:drop-shadow(0 2px 2px #0007); }
    .story-progress[hidden] { display:none; }
    .story-track { flex:1; height:4px; overflow:hidden; border-radius:8px; background:#ffffff42; box-shadow:inset 0 1px 2px #0005; }
    .story-fill { display:block; width:100%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#fff,#f2f2f2); box-shadow:0 0 5px #fff9; transform:scaleX(0); transform-origin:left center; will-change:transform; }
    .story-track.done .story-fill { transform:scaleX(1); }
    .story-track.active .story-fill { box-shadow:0 0 7px #fff; }
    .toast { position:fixed; z-index:150; left:50%; bottom:28px; translate:-50% 0; padding:11px 16px; border-radius:99px; background:#16181de8; color:#fff; font-size:13px; box-shadow:0 4px 15px #0005; animation:toastLife 2.3s both; }
    @keyframes toastLife { 0%,100% { opacity:0; transform:translateY(8px); } 12%,82% { opacity:1; transform:none; } }
    .noscript { margin:20px; color:#b00020; }
    @media (min-width:600px) { .market-nav { max-width:520px; margin:auto; } }
  </style>
</head>
<body>
  <nav class="market-nav" aria-label="Marketler">
    <button id="showAllMarkets" class="all-markets-button active" type="button" aria-pressed="true">TÜM MARKETLER</button>
    <button class="market-button" data-market="A101" aria-label="A101 broşürleri">A·101</button>
    <button class="market-button" data-market="BIM" aria-label="BİM broşürleri">BİM</button>
    <button class="market-button" data-market="SOK" aria-label="ŞOK broşürleri">ŞOK</button>
  </nav>
  <main id="content"><div class="status">Broşürler yükleniyor…</div></main>
  <noscript><p class="noscript">Broşürleri görüntülemek için JavaScript açık olmalıdır.</p></noscript>

  <section id="reader" class="reader" hidden aria-label="Broşür okuyucu">
    <div class="reader-bar">
      <button id="closeReader" type="button" aria-label="Kapat">‹</button>
      <div id="readerTitle" class="reader-title">Broşür</div>
      <div aria-hidden="true"></div>
    </div>
    <div id="storyProgress" class="story-progress" hidden></div>
    <div id="readerPages" class="reader-pages"></div>
    <div id="readerCounter" class="reader-footer">1 / 1</div>
  </section>

  <script>
  (() => {
    'use strict';

    const HOME_MANIFEST = 'https://oeappstudio.com/Brochures/Manifest/manifest.txt';
    const DATES_MANIFEST = 'https://oeappstudio.com/Brochures/Manifest/dates.json';
    const MARKET_MANIFESTS = Object.freeze({
      A101: 'https://oeappstudio.com/Brochures/Brochures/A101/manifest.txt',
      BIM:  'https://oeappstudio.com/Brochures/Brochures/BIM/manifest.txt',
      SOK:  'https://oeappstudio.com/Brochures/Brochures/SOK/manifest.txt'
    });
    const ADS_AFTER_ROWS = Object.freeze({
      2: 'ca-app-pub-3899323845108149/3459393464',
      4: 'ca-app-pub-3899323845108149/9961222634',
      5: 'ca-app-pub-3899323845108149/2704632847'
    });
    const ITEMS_PER_ROW = 5;

    const content = document.querySelector('#content');
    const reader = document.querySelector('#reader');
    const readerPages = document.querySelector('#readerPages');
    const readerTitle = document.querySelector('#readerTitle');
    const readerCounter = document.querySelector('#readerCounter');
    const storyProgress = document.querySelector('#storyProgress');
    const marketNav = document.querySelector('.market-nav');
    let activeReaderUrls = [];
    let homeManifestUrls = [];
    let selectedMarket = null;
    let previousOverflow = '';
    let storyMarket = null;
    let storyFrame = 0;
    let storyElapsed = 0;
    let storyLastTick = 0;
    let storyHolding = false;
    let storyLoadToken = 0;
    let storyRingDirty = false;
    let storyScrollTimer = 0;
    let storyScrollSyncing = false;
    let longPressTimer = 0;
    let longPressActive = false;
    let longPressX = 0;
    let longPressY = 0;
    let suppressStoryClickUntil = 0;
    let currentReaderIndex = 0;
    const STORY_DURATION = 5000;
    const zoomState = { page:null, image:null, scale:1, x:0, y:0, mode:null, startDistance:0, startScale:1, startX:0, startY:0, baseX:0, baseY:0 };
    const SEEN_KEY = 'oeapp_seen_brochures_v3';
    const marketCache = { A101:[], BIM:[], SOK:[] };
    let remoteDates = Object.create(null);
    let remoteMetadata = Object.create(null);
    let remoteInventoryUrls = [];
    let homeSortMode = 'date';

    function syncMarketNavHeight() {
      const height = Math.ceil(marketNav.getBoundingClientRect().height);
      if (height > 0) document.documentElement.style.setProperty('--market-nav-height',height + 'px');
    }
    let navMeasureTimer = 0;
    window.addEventListener('orientationchange',() => {
      clearTimeout(navMeasureTimer);
      navMeasureTimer = setTimeout(syncMarketNavHeight,250);
    },{ passive:true });
    requestAnimationFrame(syncMarketNavHeight);

    function marketFromUrl(url) {
      const path = String(url).toUpperCase();
      if (path.includes('/A101/')) return 'A101';
      if (path.includes('/BIM/')) return 'BIM';
      if (path.includes('/SOK/')) return 'SOK';
      return null;
    }

    function marketLabel(market) { return market === 'BIM' ? 'BİM' : market === 'SOK' ? 'ŞOK' : 'A101'; }

    function brochureUrlKey(url) {
      try {
        return new URL(String(url || ''),location.href).pathname.replace(/\/{2,}/g,'/');
      } catch (_) {
        return String(url || '').split(/[?#]/,1)[0];
      }
    }

    function brochureRecordForUrl(url) {
      return remoteMetadata[url] || remoteMetadata[brochureUrlKey(url)] || null;
    }

    async function getManifest(url) {
      const response = await fetch(url, { cache:'no-cache' });
      if (!response.ok) throw new Error('Manifest alınamadı: HTTP ' + response.status);
      const text = (await response.text()).replace(/^\uFEFF/, '');
      const urls = text.split(/\r?\n/).map(v => v.trim()).filter(v => /^https?:\/\//i.test(v));
      if (!urls.length) throw new Error('Manifestte geçerli görsel bağlantısı yok.');
      return [...new Set(urls)];
    }

    function fallbackMarketUrls(market) {
      // Yayın sırasında market manifesti kısa süreliğine boş kalırsa,
      // doğrulanmış dates.json envanteri tam listeyi korur. O da yoksa ana
      // manifestteki ilgili market kartları son güvenli seçenek olur.
      const verified = remoteInventoryUrls.filter(url => marketFromUrl(url) === market);
      if (verified.length) return verified;
      return homeManifestUrls.filter(url => marketFromUrl(url) === market);
    }

    async function getMarketManifest(market) {
      try {
        return await getManifest(MARKET_MANIFESTS[market]);
      } catch (error) {
        const fallback = fallbackMarketUrls(market);
        if (fallback.length) return fallback;
        throw error;
      }
    }

    async function loadRemoteDates() {
      try {
        const response = await fetch(DATES_MANIFEST, { cache:'no-cache' });
        if (!response.ok) return;
        const data = await response.json();
        const dates = data && typeof data.dates === 'object' ? data.dates : data;
        remoteDates = Object.create(null);
        remoteMetadata = Object.create(null);
        remoteInventoryUrls = [];

        if (dates && typeof dates === 'object' && !Array.isArray(dates)) {
          Object.entries(dates).forEach(([url,label]) => {
            if (typeof label !== 'string') return;
            remoteDates[url] = label;
            remoteDates[brochureUrlKey(url)] = label;
          });
        }

        const rawItems = Array.isArray(data?.items)
          ? data.items
          : (data?.items && typeof data.items === 'object' ? Object.values(data.items) : []);
        const seenInventory = new Set();
        rawItems.forEach(item => {
          if (!item || typeof item !== 'object' || typeof item.url !== 'string') return;
          const key = brochureUrlKey(item.url_key || item.url);
          remoteMetadata[item.url] = item;
          remoteMetadata[key] = item;
          if (typeof item.label === 'string' && item.label.trim()) {
            remoteDates[item.url] = item.label.trim();
            remoteDates[key] = item.label.trim();
          }
          if (!seenInventory.has(item.url)) {
            seenInventory.add(item.url);
            remoteInventoryUrls.push(item.url);
          }
        });
        homeSortMode = data?.home_sort_mode === 'manual' ? 'manual' : 'date';
      } catch (_) {
        // Manifest yüklenemezse görseller gösterilir, tarih alanı belirtilmemiş kalır.
      }
    }

    function createCard(url, market, index) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'card';
      button.setAttribute('aria-label', marketLabel(market) + ' broşürünü aç');
      const media = document.createElement('span');
      media.className = 'card-media';
      const image = document.createElement('img');
      image.src = url;
      image.alt = marketLabel(market) + ' aktüel ürünler broşürü';
      image.loading = index < 2 ? 'eager' : 'lazy';
      image.fetchPriority = index < 2 ? 'high' : 'low';
      image.decoding = 'async';
      image.referrerPolicy = 'no-referrer';
      image.addEventListener('error', () => { media.style.background = '#eceef1'; image.alt = 'Görsel yüklenemedi'; });
      const label = document.createElement('span');
      label.className = 'card-label';
      const marketName = document.createElement('span');
      marketName.textContent = marketLabel(market);
      const date = document.createElement('span');
      date.className = 'card-date';
      date.textContent = brochureLabelForUrl(url) || 'Tarih belirtilmemiş';
      label.append(marketName, date);
      media.append(image);
      button.append(media, label);
      button.addEventListener('click', () => openReader(market, url));
      return button;
    }


    function createAd(rowNumber, unitId) {
      const wrap = document.createElement('section');
      wrap.className = 'ad-wrap';
      const slot = document.createElement('div');
      slot.className = 'ad-slot';
      slot.id = 'ad-slot-' + rowNumber;
      slot.dataset.adUnitId = unitId;
      slot.dataset.adSize = 'MEDIUM_RECTANGLE';
      slot.textContent = 'Reklam';
      wrap.append(slot);
      requestAnimationFrame(() => announceAdSlot(slot, rowNumber));
      return wrap;
    }

    function announceAdSlot(slot, rowNumber) {
      const detail = { action:'SHOW_AD', slotId:slot.id, row:rowNumber, adUnitId:slot.dataset.adUnitId, size:'MEDIUM_RECTANGLE' };
      window.dispatchEvent(new CustomEvent('oeapp:ad-slot-ready', { detail }));
      try {
        if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
          window.AppInventor.setWebViewString(JSON.stringify(detail));
          slot.classList.add('native-ready');
        }
      } catch (_) { /* Tarayıcı önizlemesinde native köprü bulunmaz. */ }
    }

    const rowRatioFrames = new WeakMap();

    function scheduleRowMediaRatio(section) {
      if (!section?.isConnected || rowRatioFrames.has(section)) return;
      const frame = requestAnimationFrame(() => {
        rowRatioFrames.delete(section);
        if (!section.isConnected) return;
        const ratios = [...section.querySelectorAll('.card img')]
          .filter(image => image.naturalWidth > 0 && image.naturalHeight > 0)
          .map(image => image.naturalWidth / image.naturalHeight);
        if (!ratios.length) return;
        // Satırdaki en uzun görselin oranı bütün kartlara uygulanır.
        // Böylece görseller kırpılmaz ve aynı satırda kart boyları eşit kalır.
        const sharedRatio = Math.max(.52,Math.min(.96,Math.min(...ratios)));
        section.style.setProperty('--row-media-ratio',sharedRatio.toFixed(4));
      });
      rowRatioFrames.set(section,frame);
    }

    function bindRowMediaRatio(section) {
      section.querySelectorAll('.card img').forEach(image => {
        if (image.complete && image.naturalWidth) scheduleRowMediaRatio(section);
        else image.addEventListener('load',() => scheduleRowMediaRatio(section),{ once:true });
      });
    }

    function renderSelectedMarket(urls) {
      content.replaceChildren();
      const groups = groupBrochuresByStatus(urls);
      const definitions = [
        { key:'current',title:'Güncel ve Yaklaşan Broşürler',className:'current-brochures' },
        { key:'past',title:'Geçmiş Broşürler',className:'past-brochures' },
        { key:'unknown',title:'Tarihi Belirlenemeyen Broşürler',className:'unknown-brochures' }
      ];
      let logicalRow = 0;
      let globalCardIndex = 0;

      definitions.forEach(definition => {
        const groupUrls = groups[definition.key];
        if (!groupUrls.length) return;
        const section = document.createElement('section');
        section.className = 'row selected-date-section ' + definition.className;
        const title = document.createElement('h2');
        title.className = 'row-title';
        title.textContent = definition.title + ' (' + groupUrls.length + ')';
        const strip = document.createElement('div');
        strip.className = 'strip';

        groupUrls.forEach((url,itemIndex) => {
          strip.append(createCard(url,selectedMarket || marketFromUrl(url) || 'A101',globalCardIndex++));
          const rowFinished = (itemIndex + 1) % ITEMS_PER_ROW === 0;
          const groupFinished = itemIndex === groupUrls.length - 1;
          if (rowFinished || groupFinished) {
            logicalRow += 1;
            if (ADS_AFTER_ROWS[logicalRow]) strip.append(createAd(logicalRow,ADS_AFTER_ROWS[logicalRow]));
          }
        });

        section.append(title,strip);
        content.append(section);
        bindRowMediaRatio(section);
      });

      if (!content.children.length) content.innerHTML = '<div class="status">Bu market için broşür bulunamadı.</div>';
    }

    function renderHome(urls) {
      if (selectedMarket) {
        renderSelectedMarket(urls);
        return;
      }
      content.replaceChildren();
      const rows = [];
      for (let start = 0; start < urls.length; start += ITEMS_PER_ROW) rows.push(urls.slice(start, start + ITEMS_PER_ROW));

      rows.forEach((rowUrls, rowIndex) => {
        const market = marketFromUrl(rowUrls[0]);
        const section = document.createElement('section');
        section.className = 'row';
        const title = document.createElement('h2');
        title.className = 'row-title';
        title.textContent = market ? marketLabel(market) : 'Güncel Broşürler';
        const strip = document.createElement('div');
        strip.className = 'strip';
        rowUrls.forEach((url, itemIndex) => {
          strip.append(createCard(url, marketFromUrl(url) || market || 'A101', rowIndex * ITEMS_PER_ROW + itemIndex));
        });
        section.append(title, strip);
        content.append(section);
        bindRowMediaRatio(section);
        const rowNumber = rowIndex + 1;
        if (!selectedMarket && ADS_AFTER_ROWS[rowNumber]) content.append(createAd(rowNumber, ADS_AFTER_ROWS[rowNumber]));
      });
    }

    function normalizedDateText(value) {
      return String(value || '').toLocaleUpperCase('tr-TR')
        .replace(/Ş/g,'S').replace(/İ/g,'I').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C')
        .replace(/[’']/g,' ').replace(/\s+/g,' ').trim();
    }


    function brochureLabelForUrl(url) {
      const record = brochureRecordForUrl(url);
      return String(record?.label || remoteDates[url] || remoteDates[brochureUrlKey(url)] || '').trim();
    }

    function brochureIsoDate(value) {
      const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return null;
      const result = new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));
      return Number.isNaN(result.getTime()) ? null : result;
    }

    function brochureDateMetaForUrl(url,index=0,referenceDate=new Date()) {
      const record = brochureRecordForUrl(url);
      const today = brochureMidnight(referenceDate);
      const start = brochureIsoDate(record?.start);
      const end = brochureIsoDate(record?.end);
      if (!start) {
        return brochureDateMeta(
          brochureLabelForUrl(url),index,today,marketFromUrl(url)
        );
      }
      if (end && today >= start && today <= end) {
        return { status:'active',start,end,rank:[0,Math.max(0,brochureDayDifference(today,end)),index] };
      }
      if (!end && start.getTime() === today.getTime()) {
        return { status:'active',start,end:null,rank:[0,0,index] };
      }
      if (!end && record?.kind === 'from' && start <= today) {
        return { status:'active',start,end:null,rank:[0,brochureDayDifference(start,today),index] };
      }
      if (start > today) {
        return { status:'upcoming',start,end,rank:[1,brochureDayDifference(today,start),index] };
      }
      const pastReference = end || start;
      return { status:'past',start,end,rank:[2,Math.max(0,brochureDayDifference(pastReference,today)),index] };
    }

    function rankedBrochureItems(urls) {
      const referenceDate = new Date();
      return urls.map((url,index) => ({
        url,
        meta:brochureDateMetaForUrl(url,index,referenceDate)
      })).map(item => ({ ...item,rank:item.meta.rank }))
        .sort((a,b) => compareBrochureRanks(a.rank,b.rank));
    }

    function rankedStoryItems(urls) {
      return rankedBrochureItems(urls).map(item => ({ url:item.url,rank:item.rank }));
    }

    function groupBrochuresByStatus(urls) {
      const groups = { current:[],past:[],unknown:[] };
      rankedBrochureItems(urls).forEach(item => {
        if (item.meta.status === 'active' || item.meta.status === 'upcoming') groups.current.push(item.url);
        else if (item.meta.status === 'past') groups.past.push(item.url);
        else groups.unknown.push(item.url);
      });
      return groups;
    }

    function sortStoriesFromToday(urls) {
      const ranked = rankedStoryItems(urls);
      const currentOrFutureExists = ranked.some(item => item.rank[0] <= 1);
      // Güncel/gelecek içerik varsa ileri tarih düzeni korunur ve geçmiş
      // karıştırılmaz. Hiç yoksa hikâye boş kalmasın: en yakın geçmişten
      // daha eskiye doğru mevcut görsellerin tamamı gösterilir.
      return (currentOrFutureExists ? ranked.filter(item => item.rank[0] !== 2) : ranked)
        .map(item => item.url);
    }

    function sortReaderFollowingUrls(urls) {
      const ranked = rankedStoryItems(urls);
      const currentOrFuture = ranked.filter(item => item.rank[0] <= 1);
      const unknown = ranked.filter(item => item.rank[0] === 3);
      // Bugün veya gelecek tarihli içerik varsa hikâye kuralını koru.
      if (currentOrFuture.length) return [...currentOrFuture,...unknown].map(item => item.url);
      // A101 örneğindeki gibi tamamı geçmişse okuyucuyu tek sayfaya düşürme;
      // en yakın geçmiş tarihten geriye doğru bütün sayfaları göster.
      return ranked.map(item => item.url);
    }

    const BROCHURE_MONTHS = Object.freeze({
      OCAK:0,SUBAT:1,MART:2,NISAN:3,MAYIS:4,HAZIRAN:5,
      TEMMUZ:6,AGUSTOS:7,EYLUL:8,EKIM:9,KASIM:10,ARALIK:11
    });
    const BROCHURE_MONTH_PATTERN = Object.keys(BROCHURE_MONTHS).join('|');
    const ONE_DAY = 86400000;

    function brochureMidnight(value=new Date()) {
      const date = new Date(value);
      date.setHours(0,0,0,0);
      return date;
    }

    function brochureDayDifference(fromDate,toDate) {
      const from = Date.UTC(fromDate.getFullYear(),fromDate.getMonth(),fromDate.getDate());
      const to = Date.UTC(toDate.getFullYear(),toDate.getMonth(),toDate.getDate());
      return (to-from)/ONE_DAY;
    }

    function makeBrochureDate(day,month,yearValue,referenceDate) {
      const numericDay = Number(day);
      const numericMonth = Number(month);
      let year = yearValue ? Number(yearValue) : referenceDate.getFullYear();
      if (yearValue && year < 100) year += 2000;
      let date = new Date(year,numericMonth,numericDay);
      if (date.getFullYear() !== year || date.getMonth() !== numericMonth || date.getDate() !== numericDay) return null;
      // Yıl yazmayan Aralık → Ocak/Şubat geçişlerini yeni yıl kabul et.
      if (!yearValue && referenceDate.getMonth() >= 10 && numericMonth <= 1 && date < referenceDate) {
        date = new Date(year + 1,numericMonth,numericDay);
      }
      return date;
    }

    function brochureDateWindow(label,referenceDate=new Date()) {
      const text = normalizedDateText(label);
      if (!text) return { start:null,end:null };
      const today = brochureMidnight(referenceDate);
      let start = null;
      let end = null;

      // 10.01.2027 – 15.01.2027 gibi sayısal tarih aralıkları.
      let match = text.match(/\b(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?\s*[-–—]\s*(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?/);
      if (match) {
        const sharedYear = match[3] || match[6];
        start = makeBrochureDate(match[1],Number(match[2])-1,match[3] || sharedYear,today);
        end = makeBrochureDate(match[4],Number(match[5])-1,match[6] || sharedYear,today);
      }

      // 22 – 28 Ağustos 2026 gibi ayın yalnızca bir kez yazıldığı aralıklar.
      if (!start) {
        match = text.match(new RegExp('\\b(\\d{1,2})\\s*[-–—]\\s*(\\d{1,2})\\s+(' + BROCHURE_MONTH_PATTERN + ')(?:\\s+(\\d{4}))?'));
        if (match) {
          start = makeBrochureDate(match[1],BROCHURE_MONTHS[match[3]],match[4],today);
          end = makeBrochureDate(match[2],BROCHURE_MONTHS[match[3]],match[4],today);
        }
      }

      // 22 Ağustos – 15 Eylül 2026 ve 24 Mart – 31 Aralık gibi aralıklar.
      if (!start) {
        const expression = new RegExp('\\b(\\d{1,2})\\s+(' + BROCHURE_MONTH_PATTERN + ')(?:\\s+(\\d{4}))?','g');
        const found = [...text.matchAll(expression)];
        if (found.length) {
          const sharedYear = found[0][3] || found[1]?.[3];
          start = makeBrochureDate(found[0][1],BROCHURE_MONTHS[found[0][2]],found[0][3] || sharedYear,today);
          if (found.length > 1) {
            end = makeBrochureDate(found[1][1],BROCHURE_MONTHS[found[1][2]],found[1][3] || sharedYear,today);
          }
        }
      }

      // 10.01.2027 gibi tek sayısal tarih.
      if (!start) {
        match = text.match(/\b(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?/);
        if (match) start = makeBrochureDate(match[1],Number(match[2])-1,match[3],today);
      }

      if (start && end && end < start) end.setFullYear(start.getFullYear() + 1);
      return { start,end };
    }

    function brochureDateMeta(label,index=0,referenceDate=new Date(),market=null) {
      const today = brochureMidnight(referenceDate);
      const { start,end } = brochureDateWindow(label,today);
      if (!start) return { status:'unknown',start:null,end:null,rank:[3,Number.POSITIVE_INFINITY,index] };

      if (end && today >= start && today <= end) {
        return { status:'active',start,end,rank:[0,Math.max(0,brochureDayDifference(today,end)),index] };
      }
      if (!end && start.getTime() === today.getTime()) {
        return { status:'active',start,end:null,rank:[0,0,index] };
      }
      // A101 afişlerindeki tek tarih, kampanyanın başladığı günü belirtir.
      // Örneğin "27 Ağustos Perşembe", 27 Ağustos'tan itibaren geçerlidir.
      if (market === 'A101' && !end && start <= today) {
        return { status:'active',start,end:null,rank:[0,brochureDayDifference(start,today),index] };
      }
      if (start > today) {
        return { status:'upcoming',start,end,rank:[1,brochureDayDifference(today,start),index] };
      }
      const pastReference = end || start;
      return { status:'past',start,end,rank:[2,Math.max(0,brochureDayDifference(pastReference,today)),index] };
    }

    function compareBrochureRanks(a,b) {
      return a[0]-b[0] || a[1]-b[1] || a[2]-b[2];
    }

    function sortHomeManifestByMarketDate(urls) {
      if (homeSortMode === 'manual') return [...urls];
      const referenceDate = new Date();
      const marketBuckets = {};
      urls.forEach((url,index) => {
        const market = marketFromUrl(url) || 'OTHER';
        if (!marketBuckets[market]) marketBuckets[market] = [];
        marketBuckets[market].push({
          url,
          rank:brochureDateMetaForUrl(url,index,referenceDate).rank
        });
      });
      Object.values(marketBuckets).forEach(items => items.sort((a,b) => compareBrochureRanks(a.rank,b.rank)));
      const cursors = {};
      return urls.map(originalUrl => {
        const market = marketFromUrl(originalUrl) || 'OTHER';
        const position = cursors[market] || 0;
        cursors[market] = position + 1;
        return marketBuckets[market][position].url;
      });
    }

    function applyHomeFilter(market=null) {
      selectedMarket = market;
      content.classList.toggle('filtered-view', Boolean(market));
      // Tek market görünümünde ana sayfanın seçilmiş 5/10 görseli değil,
      // marketin kendi manifestindeki broşürlerin tamamı gösterilir.
      const urls = market ? [...(marketCache[market] || [])] : sortHomeManifestByMarketDate(homeManifestUrls);
      renderHome(urls);
      const allButton = document.querySelector('#showAllMarkets');
      allButton.classList.toggle('active', !market);
      allButton.setAttribute('aria-pressed', String(!market));
      document.querySelectorAll('.market-button').forEach(button => {
        const selected = button.dataset.market === market;
        button.classList.toggle('selected', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
    }

    async function openReader(market, clickedUrl) {
      if (!MARKET_MANIFESTS[market]) return;
      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      reader.hidden = false;
      reader.classList.remove('story-mode');
      storyProgress.hidden = true;
      storyMarket = null;
      cancelAnimationFrame(storyFrame);
      readerTitle.textContent = marketLabel(market) + ' Broşürü';
      readerPages.innerHTML = '<div class="status">Broşür yükleniyor…</div>';
      readerCounter.textContent = 'Yükleniyor…';
      try {
        const allUrls = await getMarketManifest(market);
        // Kullanıcının seçtiği kart her zaman ilk açılır. Devamındaki
        // sayfalar hikâyeyle aynı tarih filtresi ve sıralamasını kullanır.
        const orderedFollowingUrls = sortReaderFollowingUrls(allUrls.filter(url => url !== clickedUrl));
        activeReaderUrls = [clickedUrl, ...orderedFollowingUrls];
        readerPages.replaceChildren(...activeReaderUrls.map((url, index) => {
          const page = document.createElement('div');
          page.className = 'page';
          const image = document.createElement('img');
          image.src = url;
          image.alt = marketLabel(market) + ' broşür sayfası ' + (index + 1);
          image.loading = index < 2 ? 'eager' : 'lazy';
          image.decoding = 'async';
          image.referrerPolicy = 'no-referrer';
          page.append(image);
          return page;
        }));
        readerPages.scrollLeft = 0;
        updateCounter();
      } catch (error) {
        activeReaderUrls = [clickedUrl];
        readerPages.replaceChildren();
        const page = document.createElement('div');
        page.className = 'page';
        const image = document.createElement('img');
        image.src = clickedUrl;
        image.alt = marketLabel(market) + ' broşürü';
        page.append(image);
        readerPages.append(page);
        readerCounter.textContent = '1 / 1';
      }
    }

    function readSeen() {
      try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (_) { return {}; }
    }

    function markSeen(market, url, deferRing=false) {
      if (!market || !url) return;
      const seen = readSeen();
      const list = new Set(Array.isArray(seen[market]) ? seen[market] : []);
      list.add(url);
      seen[market] = [...list].slice(-400);
      try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (_) {}
      if (deferRing) storyRingDirty = true;
      else updateStoryRing(market);
    }

    function unseenFor(market) {
      const seen = new Set(readSeen()[market] || []);
      return sortStoriesFromToday(marketCache[market] || []).filter(url => !seen.has(url));
    }

    function updateStoryRing(market) {
      const button = document.querySelector('.market-button[data-market="' + market + '"]');
      if (!button) return;
      const count = unseenFor(market).length;
      button.classList.toggle('has-new', count > 0);
      let badge = button.querySelector('.story-count');
      if (count > 0) {
        if (!badge) { badge = document.createElement('span'); badge.className = 'story-count'; button.append(badge); }
        badge.textContent = count > 99 ? '99+' : count;
        button.setAttribute('aria-label', marketLabel(market) + ': ' + count + ' yeni broşür');
      } else {
        if (badge) badge.remove();
        button.setAttribute('aria-label', marketLabel(market) + ': yeni broşür yok');
      }
    }

    async function refreshStories() {
      await Promise.all(Object.keys(MARKET_MANIFESTS).map(async market => {
        try {
          marketCache[market] = await getMarketManifest(market);
          updateStoryRing(market);
          // Kullanıcı bu marketi seçmişse arka plandaki tam listeyi de yenile.
          if (selectedMarket === market) applyHomeFilter(market);
        } catch (_) {}
      }));
    }

    function showToast(message) {
      document.querySelector('.toast')?.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.append(toast);
      setTimeout(() => toast.remove(), 2400);
    }

    function ensureStoryImage(index) {
      const image = readerPages.children[index]?.querySelector('img');
      if (!image) return Promise.resolve();
      if (!image.src) {
        image.fetchPriority = index <= currentReaderIndex + 1 ? 'high' : 'auto';
        image.src = image.dataset.src;
      }
      if (image.complete) return image.naturalWidth ? image.decode?.().catch(() => {}) : Promise.resolve();
      return new Promise(resolve => {
        image.addEventListener('load',resolve,{ once:true });
        image.addEventListener('error',resolve,{ once:true });
      }).then(() => image.decode?.().catch(() => {}));
    }

    async function openStory(market) {
      if (!marketCache[market].length) {
        try { marketCache[market] = await getMarketManifest(market); } catch (error) { showError(error); return; }
      }
      const unseen = unseenFor(market);
      // Yeni içerik varsa Instagram gibi önce yeniler; tümü görüldüyse
      // marketin bugün geçerli ve gelecek tarihli broşürleri yeniden oynatılır.
      const storySource = unseen.length ? unseen : [...marketCache[market]];
      const urls = sortStoriesFromToday(storySource);
      if (!urls.length) { showToast(marketLabel(market) + ' broşürü bulunamadı'); return; }
      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      storyMarket = market;
      activeReaderUrls = urls;
      currentReaderIndex = 0;
      reader.classList.add('story-mode');
      reader.classList.remove('story-paused');
      reader.hidden = false;
      readerTitle.textContent = '';
      storyProgress.hidden = false;
      storyProgress.replaceChildren(...urls.map(() => {
        const track = document.createElement('span'); track.className = 'story-track';
        const fill = document.createElement('span'); fill.className = 'story-fill'; track.append(fill); return track;
      }));
      readerPages.replaceChildren(...urls.map((url,index) => {
        const page = document.createElement('div'); page.className = 'page';
        const image = document.createElement('img'); image.src = url; image.alt = marketLabel(market) + ' yeni broşür ' + (index + 1); image.decoding = 'async'; image.loading = index < 2 ? 'eager' : 'lazy'; image.fetchPriority = index < 2 ? 'high' : 'low'; image.referrerPolicy = 'no-referrer';
        page.append(image); return page;
      }));
      readerPages.scrollLeft = 0;
      await activateStory(0);
    }

    async function activateStory(index, syncScroll=true) {
      if (!storyMarket || !activeReaderUrls.length) return;
      const nextIndex = Math.max(0, Math.min(index, activeReaderUrls.length - 1));
      if (nextIndex === currentReaderIndex && readerPages.children[nextIndex]?.classList.contains('active')) return;
      const token = ++storyLoadToken;
      pauseStoryClock();
      await ensureStoryImage(nextIndex);
      if (token !== storyLoadToken || !storyMarket || reader.hidden) return;
      reader.classList.remove('story-paused');
      currentReaderIndex = nextIndex;
      [...readerPages.children].forEach((page,i) => page.classList.toggle('active', i === currentReaderIndex));
      if (syncScroll) {
        storyScrollSyncing = true;
        readerPages.scrollLeft = currentReaderIndex * readerPages.clientWidth;
        requestAnimationFrame(() => { storyScrollSyncing = false; });
      }
      const tracks = [...storyProgress.children];
      tracks.forEach((track,i) => {
        track.className = 'story-track' + (i < currentReaderIndex ? ' done' : '');
        const fill = track.querySelector('.story-fill');
        if (fill) fill.style.transform = i < currentReaderIndex ? 'scaleX(1)' : 'scaleX(0)';
      });
      tracks[currentReaderIndex]?.classList.add('active');
      markSeen(storyMarket, activeReaderUrls[currentReaderIndex], true);
      readerCounter.textContent = (currentReaderIndex + 1) + ' / ' + activeReaderUrls.length;
      ensureStoryImage(currentReaderIndex + 1);
      startStoryClock(true);
    }

    function currentStoryFill() {
      return storyProgress.children[currentReaderIndex]?.querySelector('.story-fill') || null;
    }

    function storyTick(now) {
      if (!storyMarket || reader.hidden || storyHolding || zoomState.scale > 1.01) return;
      storyElapsed += Math.max(0,now - storyLastTick);
      storyLastTick = now;
      const fill = currentStoryFill();
      const ratio = Math.min(1,storyElapsed / STORY_DURATION);
      if (fill) fill.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
      if (ratio >= 1) {
        if (currentReaderIndex < activeReaderUrls.length - 1) activateStory(currentReaderIndex + 1);
        else closeReader();
        return;
      }
      storyFrame = requestAnimationFrame(storyTick);
    }

    function startStoryClock(reset=false) {
      cancelAnimationFrame(storyFrame);
      const fill = currentStoryFill();
      if (!fill || !storyMarket) return;
      if (reset) storyElapsed = 0;
      fill.style.transform = 'scaleX(' + Math.min(1,storyElapsed / STORY_DURATION).toFixed(4) + ')';
      storyHolding = false;
      reader.classList.remove('story-paused');
      storyLastTick = performance.now();
      storyFrame = requestAnimationFrame(storyTick);
    }

    function pauseStoryClock() {
      if (!storyMarket || storyHolding) return;
      cancelAnimationFrame(storyFrame);
      storyHolding = true;
      reader.classList.add('story-paused');
    }

    function resumeStoryClock() {
      if (!storyMarket || !storyHolding || reader.hidden || zoomState.scale > 1.01) return;
      startStoryClock(false);
    }

    function closeReader() {
      cancelAnimationFrame(storyFrame);
      storyLoadToken += 1;
      clearTimeout(storyScrollTimer);
      storyScrollSyncing = false;
      clearTimeout(longPressTimer);
      storyHolding = false;
      longPressActive = false;
      resetZoom(false);
      reader.hidden = true;
      reader.classList.remove('story-mode');
      reader.classList.remove('story-paused');
      storyProgress.hidden = true;
      readerPages.replaceChildren();
      activeReaderUrls = [];
      const closedStoryMarket = storyMarket;
      storyMarket = null;
      if (storyRingDirty && closedStoryMarket) updateStoryRing(closedStoryMarket);
      storyRingDirty = false;
      document.body.style.overflow = previousOverflow;
    }

    function updateCounter() {
      if (zoomState.scale > 1.01) return;
      if (!activeReaderUrls.length) return;
      if (storyMarket) return;
      const index = Math.min(activeReaderUrls.length - 1, Math.max(0, Math.round(readerPages.scrollLeft / readerPages.clientWidth)));
      readerCounter.textContent = (index + 1) + ' / ' + activeReaderUrls.length;
    }

    let counterFrame = 0;
    readerPages.addEventListener('scroll', () => {
      if (storyMarket) {
        if (storyScrollSyncing || zoomState.scale > 1.01) return;
        pauseStoryClock();
        clearTimeout(storyScrollTimer);
        storyScrollTimer = setTimeout(() => {
          if (!storyMarket || reader.hidden || zoomState.scale > 1.01 || longPressActive) return;
          const width = Math.max(1,readerPages.clientWidth);
          const index = Math.min(activeReaderUrls.length - 1,Math.max(0,Math.round(readerPages.scrollLeft / width)));
          if (index !== currentReaderIndex) activateStory(index,false);
          else resumeStoryClock();
        },80);
        return;
      }
      cancelAnimationFrame(counterFrame);
      counterFrame = requestAnimationFrame(updateCounter);
    }, { passive:true });
    document.querySelector('#closeReader').addEventListener('click', closeReader);

    function touchDistance(a,b) { return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY); }

    function activeZoomPage() {
      const index = Math.min(activeReaderUrls.length - 1, Math.max(0, Math.round(readerPages.scrollLeft / Math.max(1,readerPages.clientWidth))));
      return readerPages.children[index] || null;
    }

    function applyZoom() {
      if (!zoomState.image) return;
      zoomState.image.style.transform = 'translate3d(' + zoomState.x + 'px,' + zoomState.y + 'px,0) scale(' + zoomState.scale + ')';
    }

    function clampPan() {
      if (!zoomState.page || !zoomState.image) return;
      const maxX = Math.max(0,(zoomState.image.clientWidth * zoomState.scale - zoomState.page.clientWidth) / 2);
      const maxY = Math.max(0,(zoomState.image.clientHeight * zoomState.scale - zoomState.page.clientHeight) / 2);
      zoomState.x = Math.max(-maxX,Math.min(maxX,zoomState.x));
      zoomState.y = Math.max(-maxY,Math.min(maxY,zoomState.y));
    }

    function resetZoom(restartStory=true) {
      if (zoomState.image) zoomState.image.style.transform = '';
      if (zoomState.page) zoomState.page.classList.remove('zoomed');
      zoomState.page = null; zoomState.image = null; zoomState.scale = 1; zoomState.x = 0; zoomState.y = 0; zoomState.mode = null;
      readerPages.classList.remove('zoom-lock');
      if (restartStory && storyMarket && !reader.hidden) resumeStoryClock();
    }

    readerPages.addEventListener('touchstart', event => {
      if (event.touches.length === 2) {
        clearTimeout(longPressTimer);
        longPressActive = false;
        const page = activeZoomPage();
        const image = page?.querySelector('img');
        if (!page || !image) return;
        pauseStoryClock();
        zoomState.page = page; zoomState.image = image; zoomState.mode = 'pinch';
        zoomState.startDistance = Math.max(1,touchDistance(event.touches[0],event.touches[1]));
        zoomState.startScale = zoomState.scale;
        readerPages.classList.add('zoom-lock');
        page.classList.add('zoomed');
        event.preventDefault();
      } else if (event.touches.length === 1) {
        if (zoomState.scale > 1.01) {
          zoomState.mode = 'pan';
          zoomState.startX = event.touches[0].clientX; zoomState.startY = event.touches[0].clientY;
          zoomState.baseX = zoomState.x; zoomState.baseY = zoomState.y;
          event.preventDefault();
        } else if (storyMarket) {
          longPressX = event.touches[0].clientX;
          longPressY = event.touches[0].clientY;
          clearTimeout(longPressTimer);
          longPressTimer = setTimeout(() => {
            longPressActive = true;
            suppressStoryClickUntil = Date.now() + 600;
            pauseStoryClock();
            try { navigator.vibrate?.(12); } catch (_) {}
          },350);
        }
      }
    }, { passive:false });

    readerPages.addEventListener('touchmove', event => {
      if (event.touches.length === 1 && !longPressActive && longPressTimer) {
        const moved = Math.hypot(event.touches[0].clientX-longPressX,event.touches[0].clientY-longPressY);
        if (moved > 10) {
          clearTimeout(longPressTimer);
          longPressTimer = 0;
          if (storyMarket) suppressStoryClickUntil = Date.now() + 500;
        }
      }
      if (longPressActive) { event.preventDefault(); return; }
      if (zoomState.mode === 'pinch' && event.touches.length >= 2) {
        zoomState.scale = Math.max(1,Math.min(4,zoomState.startScale * touchDistance(event.touches[0],event.touches[1]) / zoomState.startDistance));
        if (zoomState.scale <= 1.01) { zoomState.scale = 1; zoomState.x = 0; zoomState.y = 0; }
        clampPan(); applyZoom(); event.preventDefault();
      } else if (zoomState.scale > 1.01 && event.touches.length === 1) {
        zoomState.x = zoomState.baseX + event.touches[0].clientX - zoomState.startX;
        zoomState.y = zoomState.baseY + event.touches[0].clientY - zoomState.startY;
        clampPan(); applyZoom(); event.preventDefault();
      }
    }, { passive:false });

    readerPages.addEventListener('touchend', event => {
      clearTimeout(longPressTimer);
      longPressTimer = 0;
      if (longPressActive && event.touches.length === 0) {
        longPressActive = false;
        suppressStoryClickUntil = Date.now() + 600;
        resumeStoryClock();
        event.preventDefault();
        return;
      }
      if (event.touches.length >= 2) return;
      if (zoomState.scale <= 1.01) resetZoom();
      else if (event.touches.length === 1) {
        zoomState.mode = 'pan';
        zoomState.startX = event.touches[0].clientX; zoomState.startY = event.touches[0].clientY;
        zoomState.baseX = zoomState.x; zoomState.baseY = zoomState.y;
      } else zoomState.mode = null;
    }, { passive:false });
    readerPages.addEventListener('touchcancel', () => {
      clearTimeout(longPressTimer);
      longPressTimer = 0;
      if (longPressActive) { longPressActive = false; resumeStoryClock(); }
    }, { passive:false });
    readerPages.addEventListener('click', event => {
      if (!storyMarket || zoomState.scale > 1.01 || Date.now() < suppressStoryClickUntil) return;
      const ratio = event.clientX / Math.max(1,window.innerWidth);
      if (ratio < .34) activateStory(currentReaderIndex - 1);
      else if (ratio > .66) currentReaderIndex < activeReaderUrls.length - 1 ? activateStory(currentReaderIndex + 1) : closeReader();
    });
    document.querySelector('#showAllMarkets').addEventListener('click', () => applyHomeFilter(null));
    document.querySelectorAll('.market-button').forEach(button => button.addEventListener('click', async () => {
      const market = button.dataset.market;
      if (!marketCache[market].length) {
        content.innerHTML = '<div class="status">' + marketLabel(market) + ' broşürleri yükleniyor…</div>';
        try { marketCache[market] = await getMarketManifest(market); }
        catch (error) { showError(error); return; }
      }
      applyHomeFilter(market);
      openStory(market);
    }));
    window.addEventListener('popstate', () => { if (!reader.hidden) closeReader(); });

    function showError(error) {
      content.innerHTML = '';
      const status = document.createElement('div');
      status.className = 'status';
      status.append(document.createTextNode('Broşürler yüklenemedi. İnternet bağlantınızı kontrol edin.'));
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'retry';
      retry.textContent = 'Tekrar Dene';
      retry.addEventListener('click', loadHome);
      status.append(document.createElement('br'), retry);
      content.append(status);
      console.error(error);
    }

    async function loadHome() {
      content.innerHTML = '<div class="status">Broşürler yükleniyor…</div>';
      try {
        const [manifestUrls] = await Promise.all([getManifest(HOME_MANIFEST),loadRemoteDates()]);
        homeManifestUrls = manifestUrls;
        applyHomeFilter(selectedMarket);
        const refresh = () => refreshStories();
        if ('requestIdleCallback' in window) window.requestIdleCallback(refresh,{ timeout:1800 });
        else setTimeout(refresh,900);
      } catch (error) { showError(error); }
    }

    loadHome();
  })();
  </script>
</body>
</html>
