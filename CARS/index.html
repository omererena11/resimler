<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=no"/>
<meta name="referrer" content="no-referrer"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Otomobil Uygulaması</title>
<meta name="cars-index-build" content="2026-08-27-compact-empty-rows-v3"/>
<style>
  :root {
    --bg-color: #F5F5F5;
    --card-width: 272px;
    --card-img-h: 230px;
    --card-bg: #FFFFFF;
    --card-radius: 12px;
    --card-gap: 7px;
    --section-gap: 12px;
    --text-primary: #1A1C1E;
    --text-secondary: #5F6B7A;
    --accent: #2563EB;
    --highlight-bg: #F0F6FF;
    --brand-logo-size: 32px;
    --brand-title-size: 18px;
    --brand-title-font: 'Arial';
    --brand-title-weight: bold;
    --brand-title-color: #1A1C1E;
    --brand-logo-gap: 8px;
    --brand-header-height: 40px;
    --brand-header-align: left;
    --brand-logo-w: 64px;
    --brand-logo-h: 64px;
    --brand-name-size: 1.1rem;
    --brand-name-font: 'Arial';
    --brand-name-color: #1A1C1E;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-color);
    color: var(--text-primary);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  #app { max-width: 100%; margin: 0 auto; }

  #top-filters {
    background: #1A1C1E;
    padding: 6px 12px;
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .cat-select {
    background: #2A2C30;
    color: #fff;
    border: 1px solid #3A3C40;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
    min-width: 110px;
    flex: 1 1 auto;
    max-width: 160px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cat-select option[value=""] { display: none; }

  #filter-nav {
    background: white;
    padding: 6px 0 2px 0;
    border-bottom: 1px solid #E8EAED;
    position: sticky;
    top: 42px;
    z-index: 9;
  }
  .filter-container {
    display: flex; overflow-x: auto; gap: 8px; padding: 0 16px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .filter-container::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
    border: 1px solid #DDE1E6; background: white; color: var(--text-primary);
    font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-btn.all-btn {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    font-weight: 600;
  }
  .filter-btn.all-btn.active {
    background: #1d4ed8;
    border-color: #1d4ed8;
  }
  .filter-btn:not(.all-btn).active {
    background: #EFF6FF;
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  #brand-search-wrapper {
    position: relative;
    margin: 8px 16px 4px 16px;
  }
  #brand-search {
    width: 100%;
    height: 44px;
    padding: 0 40px 0 40px;
    border: 1px solid #DDE1E6;
    border-radius: 22px;
    font-size: 15px;
    background: #F8FAFC;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
  }
  #brand-search:focus {
    border-color: var(--accent);
    background: white;
  }
  .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: #8E98A3;
    font-size: 18px;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: #E8EAED;
    color: #5F6B7A;
    font-size: 16px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .search-clear.visible { display: flex; }

  #brand-search-results {
    display: none;
    position: absolute;
    top: 50px;
    left: 0; right: 0;
    background: white;
    border: 1px solid #E8EAED;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    z-index: 20;
    overflow: hidden;
  }
  #brand-search-results.visible { display: block; }
  .search-result-item {
    padding: 12px 16px;
    cursor: pointer;
    font-size: 15px;
    border-bottom: 1px solid #F0F2F5;
    transition: background 0.15s;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: #F8FAFC; }
  .search-result-empty {
    padding: 14px 16px;
    color: #8E98A3;
    font-size: 14px;
    text-align: center;
  }

  main { padding: 0; }

  .brand-section {
    background: #FFFFFF;
    margin: 0 0 var(--section-gap) 0;
    padding-bottom: 6px;
    position: relative;
  }
  .brand-section::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.04), transparent);
    pointer-events: none; z-index: 2;
  }
  .brand-section::after {
    content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.04), transparent);
    pointer-events: none; z-index: 2;
  }

  .brand-header {
    display: flex;
    align-items: center;
    padding: 12px 20px 4px;
    height: var(--brand-header-height, 40px);
    gap: var(--brand-logo-gap, 8px);
    justify-content: var(--brand-header-align, left);
  }
  .brand-logo {
    width: var(--brand-logo-size, 32px);
    height: var(--brand-logo-size, 32px);
    border-radius: 50%;
    background: #F0F2F5;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .brand-logo img { max-width: 80%; max-height: 80%; object-fit: contain; }
  .brand-name {
    font-size: var(--brand-title-size, 18px);
    font-family: var(--brand-title-font, 'Arial');
    font-weight: var(--brand-title-weight, bold);
    color: var(--brand-title-color, #1A1C1E);
  }

  .brand-highlight {
    margin: 4px 6px 8px;
    padding: 10px 14px;
    background: var(--highlight-bg);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .brand-highlight .text { flex: 1; }

  .brand-highlight.marquee .text { white-space: nowrap; animation: marquee 12s linear infinite; }
  @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
  .brand-highlight.shimmer {
    background: linear-gradient(90deg, #f0f6ff 25%, #e0ecff 50%, #f0f6ff 75%) !important;
    background-size: 200% 100% !important;
    animation: shimmer 2.5s infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .brand-highlight.pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  .brand-highlight.glow { animation: glow 1.5s infinite alternate; }
  @keyframes glow { 0% { box-shadow: 0 0 5px rgba(37,99,235,0.4); } 100% { box-shadow: 0 0 20px rgba(37,99,235,0.8); } }
  .brand-highlight.slide-up .text { animation: slideUp 4s infinite; }
  @keyframes slideUp { 0% { transform: translateY(100%); opacity:0; } 10% { transform: translateY(0); opacity:1; } 90% { transform: translateY(0); opacity:1; } 100% { transform: translateY(-100%); opacity:0; } }
  .brand-highlight.typewriter .text { overflow: hidden; white-space: nowrap; border-right: 2px solid var(--accent); animation: typing 3s steps(30, end), blink-caret 0.75s step-end infinite; }
  @keyframes typing { from { width: 0; } to { width: 100%; } }
  @keyframes blink-caret { from,to { border-color: transparent; } 50% { border-color: var(--accent); } }
  .brand-highlight.border-pulse { animation: borderPulse 2s infinite; }
  @keyframes borderPulse { 0% { border-left-color: var(--accent); } 50% { border-left-color: #60a5fa; } 100% { border-left-color: var(--accent); } }
  .brand-highlight.shake { animation: shake 0.5s infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .brand-highlight.fade-in { animation: fadeIn 2s ease-in-out; }
  @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

  .models-row {
    display: flex;
    align-items: flex-start;
    overflow-x: auto;
    gap: var(--card-gap);
    padding: 8px 16px 12px;
    scrollbar-width: none;
  }
  .models-row::-webkit-scrollbar { display: none; }

  .model-card {
    flex-shrink: 0; width: var(--card-width); background: var(--card-bg);
    border-radius: var(--card-radius); overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #E8EAED;
    cursor: pointer; transition: transform 0.2s;
  }
  .model-card:active { transform: scale(0.97); }
  .model-card img { width: 100%; height: var(--card-img-h); object-fit: cover; background: #F0F1F3; display: block; }

  /* Tek marka seçildiğinde modeller aşağı doğru gider */
  .brand-section.single-brand .models-row {
    display: grid;
    grid-template-columns: 1fr;
    overflow: visible;
    gap: 10px;
    padding: 10px 12px 18px;
  }

  .brand-section.single-brand .model-card {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(118px, 38%) 1fr;
    align-items: stretch;
    min-height: 126px;
  }

  .brand-section.single-brand .model-card > img,
  .brand-section.single-brand .model-card > .placeholder-img {
    width: 100%;
    height: 100%;
    min-height: 126px;
    max-height: 180px;
    object-fit: cover;
  }

  .brand-section.single-brand .model-info {
    display: grid;
    grid-template-rows: none;
    grid-auto-rows: auto;
    row-gap: 4px;
    align-content: start;
    padding: 12px 14px;
  }

  .compare-add-btn {
    margin-top: 9px;
    width: 100%;
    min-height: 34px;
    border: 1px solid var(--accent);
    border-radius: 9px;
    background: #EFF6FF;
    color: var(--accent);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }

  .compare-add-btn.selected {
    background: var(--accent);
    color: #fff;
  }

  /* Alt karşılaştırma sepeti */
  #compare-tray {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 80;
    display: none;
    background: rgba(255,255,255,.97);
    border: 1px solid #DDE1E6;
    border-radius: 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
    padding: 10px;
    /* Android WebView: fixed + backdrop-filter bazen dokunma katmanını kilitleyebiliyor. */
    touch-action: manipulation;
    pointer-events: auto;
    isolation: isolate;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
  }

  #compare-tray.visible { display: block; }

  .compare-tray-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .compare-tray-title {
    font-size: 13px;
    font-weight: 700;
  }

  .compare-clear {
    border: none;
    background: transparent;
    color: #64748B;
    font-size: 12px;
    cursor: pointer;
  }

  .compare-chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    margin-bottom: 8px;
  }

  .compare-chips::-webkit-scrollbar { display:none; }

  .compare-chip {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #F1F5F9;
    border-radius: 18px;
    padding: 6px 7px 6px 10px;
    font-size: 11px;
    white-space: nowrap;
  }

  .compare-chip-remove {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border: none;
    border-radius: 50%;
    background: #DC2626;
    color: #fff;
    font-weight: 900;
    line-height: 22px;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .compare-start-btn {
    width: 100%;
    border: none;
    border-radius: 10px;
    min-height: 40px;
    background: var(--accent);
    color: white;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    z-index: 5;
  }

  .compare-start-btn:disabled {
    background: #CBD5E1;
    cursor: default;
  }

  /* Versiyon seçme / karşılaştırma modalları */
  .app-modal {
    position: fixed;
    inset: 0;
    z-index: 1200;
    display: none;
    background: rgba(0,0,0,.58);
    align-items: flex-end;
    justify-content: center;
  }

  .app-modal { pointer-events: none; }
  .app-modal.active { display: flex; pointer-events: auto; }

  .app-modal-panel {
    width: min(100%, 760px);
    max-height: 88vh;
    overflow-y: auto;
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 16px;
    box-shadow: 0 -10px 30px rgba(0,0,0,.22);
  }

  /* Karşılaştırma ekranı mümkün olduğunca yatay / geniş açılır */
  #compare-modal {
    align-items: stretch;
    justify-content: stretch;
    background: #fff;
  }

  #compare-modal .app-modal-panel {
    width: 100vw;
    max-width: none;
    height: 100vh;
    max-height: none;
    border-radius: 0;
    padding: 10px 12px 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: none;
  }

  #compare-modal .app-modal-head {
    flex: 0 0 auto;
    margin-bottom: 8px;
  }

  .compare-head-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .compare-orientation-btn {
    min-height: 36px;
    border: none;
    border-radius: 9px;
    padding: 0 12px;
    background: #2563EB;
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }

  .compare-orientation-btn.active {
    background: #0F766E;
  }

  /*
   * WebView gerçek orientation lock'u desteklemezse
   * sadece karşılaştırma panelini 90 derece döndürürüz.
   */
  #compare-modal.force-landscape {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #fff;
  }

  #compare-modal.force-landscape .app-modal-panel {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100vh;
    height: 100vw;
    max-width: none;
    max-height: none;
    transform: translate(-50%, -50%) rotate(90deg);
    transform-origin: center center;
    border-radius: 0;
  }

  #compare-modal.force-landscape #compare-content {
    overflow: auto;
  }

  #compare-modal.force-landscape .compare-table {
    min-width: 100%;
  }

  #compare-content {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  #compare-modal .compare-table-wrap {
    height: 100%;
    overflow: auto;
    border-radius: 10px;
  }

  #compare-modal .compare-table {
    min-width: 760px;
  }

  @media (orientation: landscape) {
    #compare-modal .compare-table {
      min-width: 100%;
    }

    .compare-table th,
    .compare-table td {
      padding: 7px 9px;
      font-size: 12px;
    }
  }

  .app-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .app-modal-title {
    font-size: 18px;
    font-weight: 800;
  }

  .app-modal-close {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: #EEF2F7;
    font-size: 22px;
    cursor: pointer;
  }

  /* Android WebView: versiyon seçim ekranını ayrı ve stabil bir dokunma katmanı yap. */
  #version-modal {
    overscroll-behavior: contain;
  }

  #version-modal .app-modal-panel {
    touch-action: pan-y;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  #version-options {
    touch-action: pan-y;
    overscroll-behavior: contain;
  }

  .version-option {
    width: 100%;
    text-align: left;
    border: 1px solid #E2E8F0;
    background: white;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    touch-action: manipulation;
    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    z-index: 1;
  }

  .version-option:active {
    transform: scale(.995);
  }

  /* Versiyon modalı açıkken alttaki sabit sepet compositor/touch katmanına karışmasın. */
  body.version-modal-open #compare-tray {
    pointer-events: none !important;
  }

  .version-option strong {
    display: block;
    font-size: 14px;
    color: #0F172A;
  }

  .version-option small {
    display: block;
    margin-top: 4px;
    color: #64748B;
  }

  .compare-table-wrap {
    overflow-x: auto;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
  }

  .compare-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 620px;
    font-size: 12px;
  }

  .compare-table th,
  .compare-table td {
    border-bottom: 1px solid #E2E8F0;
    border-right: 1px solid #E2E8F0;
    padding: 9px;
    text-align: center;
    vertical-align: middle;
  }

  .compare-table th:first-child,
  .compare-table td:first-child {
    position: sticky;
    left: 0;
    z-index: 2;
    background: #F8FAFC;
    text-align: left;
    min-width: 125px;
    font-weight: 700;
  }

  .compare-table thead th {
    background: #F8FAFC;
    font-weight: 800;
    position: sticky;
    top: 0;
    z-index: 6;
  }

  /* Sol üst köşe hücresi diğer sticky hücrelerin üzerinde kalsın */
  .compare-table thead th:first-child {
    left: 0;
    z-index: 8;
    background: #F8FAFC;
  }

  /* Yatay modda araç başlıkları kaydırırken üstte sabit kalır */
  #compare-modal.force-landscape .compare-table thead th {
    position: sticky;
    top: 0;
    z-index: 6;
    background: #F8FAFC;
  }

  @media (orientation: landscape) {
    .compare-table thead th {
      position: sticky;
      top: 0;
      z-index: 6;
      background: #F8FAFC;
    }

    .compare-table thead th:first-child {
      left: 0;
      z-index: 8;
    }
  }

  .compare-car-image {
    width: 92px;
    height: 64px;
    object-fit: contain;
    border-radius: 8px;
    display: block;
    margin: 0 auto 6px;
    background: #F8FAFC;
  }

  .compare-section-row td {
    background: #EEF5FF !important;
    color: #1D4ED8;
    font-weight: 800 !important;
    text-transform: uppercase;
    letter-spacing: .3px;
  }

  .model-card {
    display: flex;
    flex-direction: column;
    align-self: flex-start;
    height: auto;
  }

  .model-info {
    padding: 10px 14px;
    display: grid;
    /* Satırlar JS tarafından yalnızca gerçekten gerekli olan alanlar için oluşturulur. */
    grid-template-rows: none;
    grid-auto-rows: auto;
    row-gap: 4px;
    flex: 0 0 auto;
    align-content: start;
  }

  /* Tüm kartlarda aynı veri satırları aynı yükseklikte kalsın. */
  .model-name {
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    align-self: start;
  }

  .model-year {
    color: var(--text-secondary);
    font-size: 0.8rem;
    line-height: 18px;
    min-height: 18px;
  }

  .model-desc {
    color: var(--accent);
    font-size: 12px; /* veri yoksa fallback */
    line-height: 1.3;
    font-weight: 500;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .model-starting-price {
    font-size: 13px;
    font-weight: 800;
    color: #0F172A;
    line-height: 1.25;
    min-height: 50px;
    max-height: 50px;
    overflow: hidden;
  }

  .model-starting-price small {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    font-weight: 600;
    color: #64748B;
  }

  .model-slot-empty {
    visibility: hidden;
    pointer-events: none;
  }

  .compare-add-btn {
    margin-top: 0 !important;
    align-self: stretch;
  }
  .placeholder-img { background: #F0F1F3; display: flex; align-items: center; justify-content: center; height: var(--card-img-h); font-size: 2.5rem; color: #ADB5BD; }
  .empty-state, .loading { text-align: center; padding: 40px; color: #8E98A3; }

  #lightbox {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.22s ease;
  }
  #lightbox.active { opacity: 1; pointer-events: auto; }

  #viewer {
    display: flex; width: 100%; height: 100%;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    position: absolute; top: 0; left: 0;
  }
  #viewer.lock { scroll-snap-type: none; }

  .page { min-width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; scroll-snap-align: start; scroll-snap-stop: always; position: relative; overflow: hidden; }
  .pz { width: 100%; height: 100%; position: relative; touch-action: pan-x pan-y; }
  .stage { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; backface-visibility: hidden; }
  .img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: transparent; opacity: 0; transition: opacity 0.18s ease; -webkit-user-drag: none; user-select: none; pointer-events: auto; }
  .img.ready { opacity: 1; }
  .skel { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #1a1a1a 0 20%, #0a0a0a 60%); animation: pulse-skel 1.2s ease-in-out infinite; }
  @keyframes pulse-skel { 50% { filter: brightness(1.15); } }

  #counter { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 10; background: rgba(0,0,0,0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: 500; pointer-events: none; }
  .navbtn { position: fixed; top: 50%; transform: translateY(-50%); width: 42px; height: 64px; z-index: 11; border: none; border-radius: 12px; background: rgba(0,0,0,0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #ddd; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #prev { left: 8px; display: none; } #next { right: 8px; }
  .closebtn { position: fixed; top: 18px; right: 18px; z-index: 12; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: none; color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>
</head>
<body>
  <div id="app">
    <div id="top-filters">
      <select id="filter-body-type" class="cat-select">
        <option value="" selected hidden>Kasa Tipi</option>
        <option value="all">Tümü</option>
        <option value="cabrio">Cabrio</option>
        <option value="coupe">Coupe</option>
        <option value="coupe_4">Coupe 4 kapı</option>
        <option value="hatchback_3">Hatchback 3 kapı</option>
        <option value="hatchback_5">Hatchback 5 kapı</option>
        <option value="sedan">Sedan</option>
        <option value="station_wagon">Station Wagon</option>
        <option value="mpv">MPV</option>
        <option value="roadster">Roadster</option>
        <option value="suv">SUV</option>
      </select>
      <select id="filter-fuel-type" class="cat-select">
        <option value="" selected hidden>Yakıt Tipi</option>
        <option value="all">Tümü</option>
        <option value="benzin">Benzin</option>
        <option value="dizel">Dizel</option>
        <option value="hibrit">Hibrit</option>
        <option value="elektrik">Elektrik</option>
        <option value="lpg">LPG</option>
      </select>
    </div>

    <nav id="filter-nav">
      <div class="filter-container" id="filter-container"></div>
      <div id="brand-search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="brand-search" placeholder="Marka ara..." autocomplete="off"/>
        <button class="search-clear" id="search-clear">&times;</button>
        <div id="brand-search-results"></div>
      </div>
    </nav>

    <main id="content"><div class="loading">Veriler yükleniyor...</div></main>
  </div>

  <div id="compare-tray">
    <div class="compare-tray-top">
      <div class="compare-tray-title"><span id="compare-count">0</span> araç seçildi</div>
      <button class="compare-clear" id="compare-clear">Temizle</button>
    </div>
    <div class="compare-chips" id="compare-chips"></div>
    <button class="compare-start-btn" id="compare-start" disabled>KARŞILAŞTIR</button>
  </div>

  <div class="app-modal" id="version-modal">
    <div class="app-modal-panel">
      <div class="app-modal-head">
        <div class="app-modal-title" id="version-modal-title">Versiyon seç</div>
        <button class="app-modal-close" id="version-modal-close">&times;</button>
      </div>
      <div id="version-options"></div>
    </div>
  </div>

  <div class="app-modal" id="compare-modal">
    <div class="app-modal-panel">
      <div class="app-modal-head">
        <div class="app-modal-title">Araç Karşılaştırma</div>

        <div class="compare-head-actions">
          <button
            type="button"
            class="compare-orientation-btn"
            id="compare-orientation-btn"
          >
            ↔ Yatay Göster
          </button>

          <button
            class="app-modal-close"
            id="compare-modal-close"
          >
            &times;
          </button>
        </div>
      </div>
      <div id="compare-content"></div>
    </div>
  </div>

  <div id="lightbox">
    <button class="closebtn" id="lightbox-close">&times;</button>
    <div id="viewer"></div>
    <button id="prev" class="navbtn">‹</button>
    <button id="next" class="navbtn">›</button>
    <div id="counter">1 / 1</div>
  </div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const lightbox = $('#lightbox'), viewer = $('#viewer'), counter = $('#counter');
  const btnPrev = $('#prev'), btnNext = $('#next'), btnClose = $('#lightbox-close');

  // YENİ REPO YAPISI: omererena11/resimler, CARS klasörü
  const GITHUB_RAW = 'https://raw.githubusercontent.com/omererena11/resimler/main';
  const BASE_PATH = GITHUB_RAW + '/CARS/';
  const DATA_URL = BASE_PATH + 'data.json?t=' + Date.now();

  let appData = null, activeFilter = null;
  let showCardPrices = true;
  let filterBodyType = 'all';
  let filterFuelType = 'all';
  let imageCacheBuster = '';

  // Arama / karşılaştırma durumu
  let modelSearchQuery = '';
  let compareSelection = [];
  const MAX_COMPARE = 3;
  let pendingCompareModel = null;
  let compareLandscapeMode = false;

  function getImgUrl(path) {
    if (!path) return '';
    let url = path.startsWith('http') ? path : BASE_PATH + path;
    if (imageCacheBuster) {
      const separator = url.includes('?') ? '&' : '?';
      url += separator + imageCacheBuster.substring(1);
    }
    return url;
  }

  async function loadData() {
    const content = $('#content'); content.innerHTML = '<div class="loading">Veriler yükleniyor...</div>';
    try {
      const resp = await fetch(DATA_URL, { cache: 'no-store' });
      if (!resp.ok) throw new Error('Veri alınamadı');
      appData = await resp.json();
      imageCacheBuster = '?v=' + Date.now();
      applySettings(appData.home_page_settings);
      renderFilters();
      renderContent();
      initSearch();
      bindFilters();
      syncSelectors();
    } catch (e) { content.innerHTML = '<div class="empty-state">Hata oluştu: ' + e.message + '</div>'; }
  }

  function applySettings(s) {
    if (!s) return;

    // GUI: "Fiyatları Gizle / Göster"
    showCardPrices = s.show_card_prices !== false;

    const r = document.documentElement.style;
    if (s.card) {
      const baseW = (s.card.width || 170) * 1.6;
      r.setProperty('--card-width', baseW + 'px');
      r.setProperty('--card-img-h', Math.round(baseW * 27 / 32) + 'px');
    }
    if (s.carousel) r.setProperty('--card-gap', Math.round((s.carousel.gap||12) * 0.5) + 'px');
    if (s.sections) r.setProperty('--section-gap', Math.max(8, (s.sections.vertical_gap||20) / 4) + 'px');

    if (s.brand_header_settings) {
      const h = s.brand_header_settings;
      r.setProperty('--brand-logo-size', (h.logo_size || 32) + 'px');
      r.setProperty('--brand-title-size', (h.title_font_size || 18) + 'px');
      r.setProperty('--brand-title-font', h.title_font_family || 'Arial');
      r.setProperty('--brand-title-weight', h.title_font_weight || 'bold');
      r.setProperty('--brand-title-color', h.title_color || '#1A1C1E');
      r.setProperty('--brand-logo-gap', (h.logo_title_gap || 8) + 'px');
      r.setProperty('--brand-header-height', (h.header_height || 40) + 'px');
      r.setProperty('--brand-header-align', h.alignment || 'left');
    }

    if (s.brand_list_style) {
      const ls = s.brand_list_style;
      r.setProperty('--brand-logo-w', (ls.logo_width || 50) + 'px');
      r.setProperty('--brand-logo-h', (ls.logo_height || 50) + 'px');
      r.setProperty('--brand-name-size', (ls.font_size || 11) + 'px');
      r.setProperty('--brand-name-font', ls.font_family || 'Segoe UI');
      r.setProperty('--brand-name-color', ls.font_color || '#000000');
    }
  }

  function syncSelectors() {
    const bodySelect = $('#filter-body-type');
    const fuelSelect = $('#filter-fuel-type');
    if (filterBodyType === 'all') bodySelect.value = ''; else bodySelect.value = filterBodyType;
    if (filterFuelType === 'all') fuelSelect.value = ''; else fuelSelect.value = filterFuelType;
  }

  function bindFilters() {
    const bodySelect = $('#filter-body-type');
    const fuelSelect = $('#filter-fuel-type');

    function prepareBodySelect() {
      if (filterBodyType === 'all') bodySelect.value = 'all'; else bodySelect.value = filterBodyType;
    }
    bodySelect.addEventListener('mousedown', prepareBodySelect);
    bodySelect.addEventListener('touchstart', prepareBodySelect, { passive: true });
    bodySelect.addEventListener('change', () => {
      const val = bodySelect.value;
      filterBodyType = (val === 'all') ? 'all' : val;
      renderContent();
      syncSelectors();
    });
    bodySelect.addEventListener('blur', () => {
      if (filterBodyType === 'all') bodySelect.value = '';
    });

    function prepareFuelSelect() {
      if (filterFuelType === 'all') fuelSelect.value = 'all'; else fuelSelect.value = filterFuelType;
    }
    fuelSelect.addEventListener('mousedown', prepareFuelSelect);
    fuelSelect.addEventListener('touchstart', prepareFuelSelect, { passive: true });
    fuelSelect.addEventListener('change', () => {
      const val = fuelSelect.value;
      filterFuelType = (val === 'all') ? 'all' : val;
      renderContent();
      syncSelectors();
    });
    fuelSelect.addEventListener('blur', () => {
      if (filterFuelType === 'all') fuelSelect.value = '';
    });
  }

  function selectBrand(brandId) {
    activeFilter = brandId;
    modelSearchQuery = '';

    const si = $('#brand-search');
    if (si) {
      si.value = '';
      si.placeholder = activeFilter ? 'Model ara...' : 'Marka ara...';
    }

    hideSearchResults();
    updateClearButton();
    renderFilters();
    renderContent();
  }

  function renderFilters() {
    const c = $('#filter-container'); c.innerHTML = '';
    if (!appData?.brands) return;
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn all-btn' + (!activeFilter ? ' active' : '');
    allBtn.textContent = 'TÜMÜ'; allBtn.onclick = () => selectBrand(null);
    c.appendChild(allBtn);
    const excludedBrandIds = new Set([
      'araba-karsilastirma',
      'araba-kampanyalari'
    ]);

    appData.brands
      .sort((a,b) => (a.order || 0) - (b.order || 0))
      .forEach(b => {
        if (!b.show_on_homepage) return;
        if (excludedBrandIds.has(b.id)) return;

        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (activeFilter === b.id ? ' active' : '');
        btn.textContent = b.name;
        btn.onclick = () => selectBrand(b.id);
        c.appendChild(btn);
      });
  }

  function initSearch() {
    const si = $('#brand-search'), sc = $('#search-clear');

    si.placeholder = activeFilter ? 'Model ara...' : 'Marka ara...';

    si.addEventListener('input', () => {
      const q = si.value.trim().toLowerCase();
      updateClearButton();

      if (activeFilter) {
        // Marka seçiliyse gerçek model araması
        modelSearchQuery = q;
        renderContent();

        if (!q) {
          hideSearchResults();
          return;
        }

        const brand = (appData.brands || []).find(b => b.id === activeFilter);
        const models = (brand?.models || [])
          .filter(m =>
            m.show_on_homepage &&
            modelHasAllowedYear(m) &&
            m.name.toLowerCase().includes(q)
          );

        showModelSearchResults(models);
      } else {
        // TÜMÜ görünümünde marka araması
        modelSearchQuery = '';

        if (!q) {
          hideSearchResults();
          return;
        }

        const filtered = (appData.brands || []).filter(
          b =>
            b.show_on_homepage &&
            !['araba-karsilastirma', 'araba-kampanyalari'].includes(b.id) &&
            b.name.toLowerCase().includes(q)
        );

        showBrandSearchResults(filtered);
      }
    });

    sc.addEventListener('click', () => {
      si.value = '';
      modelSearchQuery = '';
      updateClearButton();
      hideSearchResults();
      renderContent();
      si.focus();
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('#brand-search-wrapper')) hideSearchResults();
    });
  }

  function updateClearButton() {
    $('#search-clear').classList.toggle(
      'visible',
      !!$('#brand-search').value.trim()
    );
  }

  function showBrandSearchResults(brands) {
    const c = $('#brand-search-results');
    c.innerHTML = '';

    if (!brands.length) {
      c.innerHTML = '<div class="search-result-empty">Marka bulunamadı</div>';
    } else {
      brands.slice(0, 8).forEach(b => {
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.textContent = b.name;
        item.addEventListener('click', () => selectBrand(b.id));
        c.appendChild(item);
      });
    }

    c.classList.add('visible');
  }

  function showModelSearchResults(models) {
    const c = $('#brand-search-results');
    c.innerHTML = '';

    if (!models.length) {
      c.innerHTML = '<div class="search-result-empty">Model bulunamadı</div>';
    } else {
      models.slice(0, 10).forEach(m => {
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.textContent = `${m.name}${m.year ? ' · ' + m.year : ''}`;

        item.addEventListener('click', () => {
          const si = $('#brand-search');
          si.value = m.name;
          modelSearchQuery = m.name.toLowerCase();
          updateClearButton();
          hideSearchResults();
          renderContent();

          setTimeout(() => {
            const el = document.querySelector(`[data-model-id="${CSS.escape(m.id)}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 50);
        });

        c.appendChild(item);
      });
    }

    c.classList.add('visible');
  }

  function hideSearchResults() {
    $('#brand-search-results').classList.remove('visible');
  }

  function normalizeFilterText(value) {
    return String(value ?? '')
      .trim()
      .toLocaleLowerCase('tr-TR')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/ı/g, 'i')
      .replace(/ğ/g, 'g')
      .replace(/ü/g, 'u')
      .replace(/ş/g, 's')
      .replace(/ö/g, 'o')
      .replace(/ç/g, 'c')
      .replace(/[^a-z0-9]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function collectFilterValues(car, keys) {
    const values = [];

    keys.forEach(key => {
      const value = car?.[key];
      if (Array.isArray(value)) values.push(...value);
      else if (value !== undefined && value !== null && value !== '') values.push(value);
    });

    const versions = Array.isArray(car?.versions) ? car.versions : [];
    versions.forEach(version => {
      keys.forEach(key => {
        const value = version?.[key];
        if (Array.isArray(value)) values.push(...value);
        else if (value !== undefined && value !== null && value !== '') values.push(value);
      });
    });

    return [...new Set(values.map(normalizeFilterText).filter(Boolean))];
  }

  function bodyTypeAliases(filterValue) {
    const aliases = {
      cabrio: [
        'cabrio', 'cabriolet', 'convertible', 'ust acilir', 'acilir tavan'
      ],
      coupe: [
        'coupe', 'kupe', '2 kapi coupe', '2 kapili coupe', 'coupe 2 kapi'
      ],
      coupe_4: [
        'coupe 4', 'coupe 4 kapi', '4 kapi coupe', '4 kapili coupe',
        'four door coupe', '4 door coupe', 'gran coupe', 'sportback'
      ],
      hatchback_3: [
        'hatchback 3', 'hatchback 3 kapi', '3 kapi hatchback',
        '3 kapili hatchback', '3 door hatchback', 'hatchback 3 door'
      ],
      hatchback_5: [
        'hatchback 5', 'hatchback 5 kapi', '5 kapi hatchback',
        '5 kapili hatchback', '5 door hatchback', 'hatchback 5 door',
        'hatchback'
      ],
      sedan: [
        'sedan', 'saloon', '4 kapi sedan', '4 kapili sedan'
      ],
      station_wagon: [
        'station wagon', 'stationwagon', 'wagon', 'estate', 'touring',
        'sports tourer', 'sport tourer', 'variant', 'avant', 'combi', 'sw'
      ],
      mpv: [
        'mpv', 'minivan', 'multi purpose vehicle', 'monovolume',
        'compact mpv'
      ],
      roadster: [
        'roadster', '2 kisilik roadster', 'two seater roadster'
      ],
      suv: [
        'suv', 'crossover', 'cuv', 'sport utility vehicle', '4x4 suv',
        'compact suv', 'mid size suv', 'large suv'
      ]
    };

    return (aliases[filterValue] || [filterValue]).map(normalizeFilterText);
  }

  function fuelTypeAliases(filterValue) {
    const aliases = {
      benzin: [
        'benzin', 'benzinli', 'petrol', 'gasoline'
      ],
      dizel: [
        'dizel', 'diesel', 'motorin'
      ],
      hibrit: [
        'hibrit', 'hybrid', 'mild hybrid', 'mhev', 'full hybrid',
        'hev', 'plug in hybrid', 'plug-in hybrid', 'phev',
        'benzin hibrit', 'dizel hibrit'
      ],
      elektrik: [
        'elektrik', 'elektrikli', 'electric', 'bev', 'ev',
        'battery electric'
      ],
      lpg: [
        'lpg', 'otogaz', 'autogas', 'benzin lpg', 'benzin+lpg'
      ]
    };

    return (aliases[filterValue] || [filterValue]).map(normalizeFilterText);
  }

  function matchesAnyAlias(values, aliases) {
    return values.some(value =>
      aliases.some(alias => {
        if (!alias) return false;
        if (value === alias) return true;
        return value.includes(alias) || alias.includes(value);
      })
    );
  }

  function matchesFilters(car) {
    if (filterBodyType !== 'all') {
      const bodyValues = collectFilterValues(car, [
        'body_types', 'body_type', 'bodyType', 'body', 'kasa_tipi', 'kasaTipi'
      ]);

      if (!bodyValues.length || !matchesAnyAlias(bodyValues, bodyTypeAliases(filterBodyType))) {
        return false;
      }
    }

    if (filterFuelType !== 'all') {
      const fuelValues = collectFilterValues(car, [
        'fuel_types', 'fuel_type', 'fuelType', 'fuel', 'yakit_tipi', 'yakitTipi'
      ]);

      if (!fuelValues.length || !matchesAnyAlias(fuelValues, fuelTypeAliases(filterFuelType))) {
        return false;
      }
    }

    return true;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function getModelKey(brandId, modelId) {
    return `${brandId}::${modelId}`;
  }

  function isModelInCompare(brandId, modelId) {
    return compareSelection.some(
      item => item.brand.id === brandId && item.model.id === modelId
    );
  }

  function syncCompareButtons() {
    const selectedKeys = new Set(
      compareSelection.map(
        item => `${item.brand.id}::${item.model.id}`
      )
    );

    document.querySelectorAll('.compare-add-btn').forEach(btn => {
      const key = `${btn.dataset.compareBrand}::${btn.dataset.compareModel}`;
      const selected = selectedKeys.has(key);

      btn.classList.toggle('selected', selected);
      btn.textContent = selected
        ? '✓ Karşılaştırmaya eklendi'
        : '+ Karşılaştır';
    });
  }

  function refreshCompareUI() {
    // Karşılaştırma seçimi değiştiğinde artık bütün model listesini
    // yeniden render etmiyoruz. Bu, büyük data.json'larda oluşan
    // takılma/donmanın ana nedenini ortadan kaldırır.
    syncCompareButtons();
    renderCompareTray();
  }

  function getModelStartingPrice(model) {
    // Önce global GUI ayarı, sonra model bazlı görünürlük.
    if (!showCardPrices) return null;
    if (model?.show_starting_price === false) return null;

    // GUI'de elle girilmiş kart fiyatı varsa onu aynen kullan.
    const manualText = String(model?.starting_price_text || '').trim();
    if (manualText) {
      return { text: manualText, numeric: null, manual: true };
    }

    // Manuel değer yoksa 2026 versiyonlarındaki en düşük geçerli fiyatı hesapla.
    const versions = Array.isArray(model?.versions) ? model.versions : [];
    const prices = versions
      .filter(v => Number(v?.year || model?.year || 0) === 2026)
      .map(v => Number(v?.price?.numeric))
      .filter(v => Number.isFinite(v) && v > 0);

    if (!prices.length) return null;

    const numeric = Math.min(...prices);
    return { text: formatTry(numeric), numeric, manual: false };
  }

  function formatTry(value) {
    try {
      return new Intl.NumberFormat(
        'tr-TR',
        {
          maximumFractionDigits: 0
        }
      ).format(value) + ' TL';
    } catch (e) {
      return String(value) + ' TL';
    }
  }

  function modelHasAllowedYear(model) {
    const allowedYears = new Set([2025, 2026]);

    const versions = Array.isArray(model?.versions)
      ? model.versions
      : [];

    if (versions.some(v => allowedYears.has(Number(v?.year)))) {
      return true;
    }

    const years = Array.isArray(model?.years)
      ? model.years.map(Number)
      : [];

    if (years.some(y => allowedYears.has(y))) {
      return true;
    }

    return allowedYears.has(Number(model?.year));
  }

  function renderContent() {
    const content = $('#content');

    if (!appData?.brands) {
      content.innerHTML = '<div class="empty-state">Veri yok</div>';
      return;
    }

    let html = '';

    appData.brands
      .sort((a,b) => (a.order || 0) - (b.order || 0))
      .forEach(brand => {
        if (!brand.show_on_homepage) return;
        if (activeFilter && brand.id !== activeFilter) return;

        let models = (brand.models || [])
          .filter(
            m =>
              m.show_on_homepage &&
              modelHasAllowedYear(m) &&
              matchesFilters(m)
          );

        if (activeFilter && modelSearchQuery) {
          models = models.filter(
            m => (m.name || '').toLowerCase().includes(modelSearchQuery)
          );
        }

        if (!models.length) return;

        models.sort(
          (a,b) => (a.order || 1) - (b.order || 1)
        );

        const logoUrl = brand.logo ? getImgUrl(brand.logo) : '';
        const singleClass = activeFilter ? ' single-brand' : '';

        // Akıllı satır hizalama:
        // Bu marka/model grubunda bir satır en az bir kartta doluysa tüm kartlarda
        // o satır için yer korunur. Hiçbir kartta dolu değilse satır tamamen kaldırılır.
        // Bir opsiyonel satır yalnızca görünür kart grubunda EN AZ BİR kartta
        // gerçek içerik varsa yer kaplar. Checkbox açık ama metin boşsa içerik sayılmaz.
        const hasVisibleYear = car =>
          car.show_year &&
          car.year !== undefined &&
          car.year !== null &&
          String(car.year).trim() !== '';

        const hasVisibleDescription = car =>
          car.show_description === true &&
          String(car.card_description ?? '').trim().length > 0;

        const hasVisiblePrice = car =>
          !!getModelStartingPrice(car);

        const showYearRow = models.some(hasVisibleYear);
        const showDescRow = models.some(hasVisibleDescription);
        const showPriceRow = models.some(hasVisiblePrice);

        const maxDescFontSize = showDescRow
          ? Math.max(
              8,
              ...models.map(car => {
                const n = Number(car?.card_description_style?.font_size || 12);
                return Number.isFinite(n) ? Math.max(8, Math.min(40, n)) : 12;
              })
            )
          : 12;

        const descRowHeight = Math.max(42, Math.ceil(maxDescFontSize * 2.7));

        const modelInfoRows = [
          '40px',
          ...(showYearRow ? ['18px'] : []),
          ...(showDescRow ? [descRowHeight + 'px'] : []),
          ...(showPriceRow ? ['50px'] : []),
          '34px'
        ].join(' ');

        html += `<section class="brand-section${singleClass}">
          <div class="brand-header">
            <div class="brand-logo">${
              brand.logo
                ? `<img src="${logoUrl}" onerror="this.parentElement.innerHTML='🏢'">`
                : '🏢'
            }</div>
            <span class="brand-name">${escapeHtml(brand.name)}</span>
          </div>`;

        if (brand.show_brand_description && brand.brand_description) {
          const style = brand.brand_description_style || {};
          const effect = style.effect || 'none';
          const effectClass = effect !== 'none' ? ' ' + effect : '';

          html += `<div class="brand-highlight${effectClass}"
            style="
              font-family:${style.font_family || 'Arial'};
              font-size:${style.font_size || 14}px;
              font-weight:${style.font_weight || 'normal'};
              font-style:${style.font_style || 'normal'};
              color:${style.color || '#1A1C1E'};
              text-align:${style.text_align || 'left'};
            ">
            <span class="text">${escapeHtml(brand.brand_description)}</span>
          </div>`;
        }

        html += '<div class="models-row">';

        models.forEach(car => {
          const thumb = car.thumbnail ? getImgUrl(car.thumbnail) : '';
          const largeImages = (
            car.large_images?.length
              ? car.large_images
              : (car.thumbnail ? [car.thumbnail] : [])
          ).map(getImgUrl);

          const selected = isModelInCompare(brand.id, car.id);

          html += `
            <div
              class="model-card"
              data-images='${JSON.stringify(largeImages)}'
              data-brand-id="${escapeHtml(brand.id)}"
              data-model-id="${escapeHtml(car.id)}"
            >
              ${
                thumb
                  ? `<img src="${thumb}" alt="${escapeHtml(car.name)}" loading="lazy"
                      onerror="this.parentElement.querySelector('.placeholder-img').style.display='flex'; this.style.display='none';">`
                  : ''
              }

              <div class="placeholder-img" style="display:${thumb ? 'none' : 'flex'};">🚗</div>

              <div class="model-info" style="grid-template-rows:${modelInfoRows};">
                <div class="model-name">${escapeHtml(car.name)}</div>

                ${showYearRow
                  ? (hasVisibleYear(car)
                      ? `<div class="model-year">${escapeHtml(car.year)}</div>`
                      : `<div class="model-year model-slot-empty" aria-hidden="true">—</div>`)
                  : ''}

                ${showDescRow
                  ? (hasVisibleDescription(car)
                      ? (() => {
                          const rawSize = Number(car?.card_description_style?.font_size || 12);
                          const fontSize = Number.isFinite(rawSize)
                            ? Math.max(8, Math.min(40, rawSize))
                            : 12;
                          const color = car?.card_description_style?.color || '#2563EB';
                          const boxHeight = Math.max(42, Math.ceil(fontSize * 2.7));

                          return `<div
                            class="model-desc"
                            style="
                              color:${escapeHtml(color)};
                              font-size:${fontSize}px;
                              line-height:1.3;
                              min-height:${boxHeight}px;
                              max-height:${boxHeight}px;
                            "
                          >${escapeHtml(car.card_description)}</div>`;
                        })()
                      : `<div class="model-desc model-slot-empty" aria-hidden="true">—</div>`)
                  : ''}

                ${showPriceRow
                  ? (() => {
                      const priceInfo = getModelStartingPrice(car);
                      return priceInfo
                        ? `<div class="model-starting-price">
                            ${escapeHtml(priceInfo.text)}
                            <small>den başlayan fiyatlarla</small>
                          </div>`
                        : `<div class="model-starting-price model-slot-empty" aria-hidden="true">—<small>—</small></div>`;
                    })()
                  : ''}

                <button
                  class="compare-add-btn${selected ? ' selected' : ''}"
                  data-compare-brand="${escapeHtml(brand.id)}"
                  data-compare-model="${escapeHtml(car.id)}"
                >
                  ${selected ? '✓ Karşılaştırmaya eklendi' : '+ Karşılaştır'}
                </button>
              </div>
            </div>`;
        });

        html += '</div></section>';
      });

    content.innerHTML = html || '<div class="empty-state">Model bulunamadı</div>';

    document.querySelectorAll('.model-card').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.closest('.compare-add-btn')) return;

        const imgs = JSON.parse(card.dataset.images || '[]');
        if (imgs?.length) openLightbox(imgs);
      });
    });

    document.querySelectorAll('.compare-add-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        beginCompareSelection(
          btn.dataset.compareBrand,
          btn.dataset.compareModel
        );
      });
    });

    renderCompareTray();
  }

  // =========================================================
  // KARŞILAŞTIRMA
  // =========================================================

  function findBrandModel(brandId, modelId) {
    const brand = (appData.brands || []).find(b => b.id === brandId);
    const model = (brand?.models || []).find(m => m.id === modelId);
    return { brand, model };
  }

  function beginCompareSelection(brandId, modelId) {
    const existingIndex = compareSelection.findIndex(
      item => item.brand.id === brandId && item.model.id === modelId
    );

    if (existingIndex >= 0) {
      compareSelection.splice(existingIndex, 1);
      refreshCompareUI();
      return;
    }

    if (compareSelection.length >= MAX_COMPARE) {
      alert(`En fazla ${MAX_COMPARE} araç karşılaştırabilirsin.`);
      return;
    }

    const { brand, model } = findBrandModel(brandId, modelId);
    if (!brand || !model) return;

    const versions = Array.isArray(model.versions) ? model.versions : [];

    if (versions.length === 0) {
      alert('Bu modelde karşılaştırılabilir versiyon bilgisi bulunamadı.');
      return;
    }

    if (versions.length === 1) {
      addCompareItem(brand, model, versions[0]);
      return;
    }

    pendingCompareModel = { brand, model };
    openVersionModal(brand, model);
  }

  // =========================================================
  // WEBVIEW-STABİL VERSİYON SEÇİM MODALI
  // Butonlara her açılışta ayrı listener bağlamıyoruz. Modal seviyesinde
  // event delegation + pointer/touch fallback kullanıyoruz.
  // =========================================================
  let versionModalSession = 0;
  let versionSelectBusy = false;
  let lastVersionActivation = 0;
  let versionTouchStart = null;

  function recoverVersionModalState() {
    const modal = $('#version-modal');
    const panel = modal?.querySelector('.app-modal-panel');
    const box = $('#version-options');

    if (!modal?.classList.contains('active')) return;

    modal.style.pointerEvents = 'auto';
    if (panel) {
      panel.style.pointerEvents = 'auto';
      panel.style.transform = 'translateZ(0)';
      panel.style.webkitTransform = 'translateZ(0)';
    }
    if (box) box.style.pointerEvents = 'auto';

    modal.querySelectorAll('.version-option').forEach(btn => {
      btn.style.pointerEvents = 'auto';
      btn.disabled = false;
    });
  }

  function openVersionModal(brand, model) {
    const modal = $('#version-modal');
    const box = $('#version-options');
    if (!modal || !box) return;

    // Önce eski/yarım kalmış modal state'ini temizle.
    versionModalSession += 1;
    versionSelectBusy = false;
    lastVersionActivation = 0;
    versionTouchStart = null;
    modal.classList.remove('active');
    modal.style.pointerEvents = 'none';
    box.replaceChildren();

    pendingCompareModel = { brand, model };
    $('#version-modal-title').textContent =
      `${brand.name} ${model.name} · Versiyon seç`;

    const fragment = document.createDocumentFragment();
    (model.versions || []).forEach((version, index) => {
      const price = version.price?.raw || 'Fiyat bilgisi yok';
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'version-option';
      button.dataset.versionIndex = String(index);
      button.innerHTML = `
        <strong>${escapeHtml(version.name || version.slug || 'Versiyon')}</strong>
        <small>${escapeHtml(version.year || model.year || '')} · ${escapeHtml(price)}</small>
      `;
      fragment.appendChild(button);
    });
    box.appendChild(fragment);

    document.body.classList.add('version-modal-open');
    modal.classList.add('active');
    modal.style.pointerEvents = 'auto';

    // WebView compositor'a bir frame verip dokunma katmanını doğrula.
    requestAnimationFrame(() => {
      recoverVersionModalState();
      requestAnimationFrame(recoverVersionModalState);
    });
  }

  function closeVersionModal() {
    const modal = $('#version-modal');
    if (modal) {
      modal.classList.remove('active');
      modal.style.pointerEvents = 'none';
    }
    document.body.classList.remove('version-modal-open');
    pendingCompareModel = null;
    versionSelectBusy = false;
    versionTouchStart = null;
  }

  function activateVersionOption(target, event) {
    const modal = $('#version-modal');
    if (!modal?.classList.contains('active')) return;

    const button = target?.closest?.('.version-option');
    if (!button || !modal.contains(button)) return;

    const now = Date.now();
    if (versionSelectBusy || now - lastVersionActivation < 450) return;

    const pending = pendingCompareModel;
    const index = Number(button.dataset.versionIndex);
    const version = pending?.model?.versions?.[index];
    if (!pending?.brand || !pending?.model || !version) {
      recoverVersionModalState();
      return;
    }

    if (event?.cancelable) event.preventDefault();
    event?.stopPropagation?.();

    lastVersionActivation = now;
    versionSelectBusy = true;

    try {
      // Önce modalı kapat: WebView'de aynı frame içinde DOM değişimi + modal
      // katmanı açık kalması sonucu oluşan touch deadlock'u önler.
      closeVersionModal();
      addCompareItem(pending.brand, pending.model, version);
    } catch (err) {
      console.error('Versiyon seçimi başarısız:', err);
      versionSelectBusy = false;
    }
  }

  function addCompareItem(brand, model, version) {
    if (compareSelection.length >= MAX_COMPARE) return;

    compareSelection.push({
      brand,
      model,
      version
    });

    refreshCompareUI();
  }

  function renderCompareTray() {
    const tray = $('#compare-tray');
    const chips = $('#compare-chips');
    const count = $('#compare-count');
    const startBtn = $('#compare-start');

    if (!tray || !chips || !count || !startBtn) return;

    count.textContent = compareSelection.length;

    // DOM'u tek seferde üret; büyük listelerde gereksiz repaint azaltır.
    const fragment = document.createDocumentFragment();

    compareSelection.forEach((item, index) => {
      const chip = document.createElement('div');
      chip.className = 'compare-chip';

      const label = document.createElement('span');
      label.textContent =
        `${item.brand.name} ${item.model.name} · ${item.version.name || ''}`;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'compare-chip-remove';
      removeBtn.type = 'button';
      removeBtn.textContent = '−';
      removeBtn.setAttribute(
        'aria-label',
        `${item.brand.name} ${item.model.name} karşılaştırmadan çıkar`
      );

      removeBtn.addEventListener('click', e => {
        e.stopPropagation();

        compareSelection.splice(index, 1);
        refreshCompareUI();
      });

      chip.appendChild(label);
      chip.appendChild(removeBtn);
      fragment.appendChild(chip);
    });

    chips.replaceChildren(fragment);

    tray.classList.toggle(
      'visible',
      compareSelection.length > 0
    );

    startBtn.disabled = compareSelection.length < 2;
  }

  function valueOf(item, key) {
    const specs = item.version?.technical_specs || {};

    if (key === '__price__') {
      return item.version?.price?.raw || '—';
    }

    if (key === '__year__') {
      return item.version?.year || item.model?.year || '—';
    }

    if (key === '__fuel__') {
      return specs['Enerji Türü'] || '—';
    }

    return specs[key] ?? '—';
  }

  async function enterCompareLandscape() {
    const modal = $('#compare-modal');
    const btn = $('#compare-orientation-btn');

    compareLandscapeMode = true;

    if (btn) {
      btn.classList.add('active');
      btn.textContent = '↕ Dikey Göster';
    }

    let realLandscape = false;

    try {
      // Orientation API, çoğu Android WebView'da kullanıcı tıklaması
      // sonrasında fullscreen iken daha güvenilir çalışır.
      if (
        document.documentElement.requestFullscreen &&
        !document.fullscreenElement
      ) {
        try {
          await document.documentElement.requestFullscreen();
        } catch (e) {
          console.debug('Fullscreen açılamadı:', e);
        }
      }

      if (
        screen.orientation &&
        typeof screen.orientation.lock === 'function'
      ) {
        try {
          await screen.orientation.lock('landscape');
        } catch (e) {
          console.debug('Landscape lock desteklenmedi:', e);
        }
      }

      // Android'e gerçek dönüş için kısa süre ver.
      await new Promise(resolve => setTimeout(resolve, 250));

      realLandscape = window.innerWidth > window.innerHeight;

    } catch (e) {
      console.debug('Landscape işlemi başarısız:', e);
    }

    /*
     * Gerçek cihaz yönü değişmediyse karşılaştırma ekranını
     * CSS ile yatay hale getir.
     */
    if (modal) {
      modal.classList.toggle(
        'force-landscape',
        !realLandscape
      );
    }
  }

  async function exitCompareLandscape() {
    const modal = $('#compare-modal');
    const btn = $('#compare-orientation-btn');

    compareLandscapeMode = false;

    if (modal) {
      modal.classList.remove('force-landscape');
    }

    if (btn) {
      btn.classList.remove('active');
      btn.textContent = '↔ Yatay Göster';
    }

    try {
      if (
        screen.orientation &&
        typeof screen.orientation.unlock === 'function'
      ) {
        screen.orientation.unlock();
      }
    } catch (e) {
      console.debug('Orientation unlock desteklenmedi:', e);
    }

    try {
      if (document.fullscreenElement && document.exitFullscreen) {
        await document.exitFullscreen();
      }
    } catch (e) {
      console.debug('Fullscreen kapatılamadı:', e);
    }
  }

  async function toggleCompareOrientation() {
    if (compareLandscapeMode) {
      await exitCompareLandscape();
    } else {
      await enterCompareLandscape();
    }
  }

  async function openCompareModal() {
    if (compareSelection.length < 2) return;

    const rows = [
      { section: 'Genel' },
      ['Fiyat', '__price__'],
      ['Model Yılı', '__year__'],
      ['Enerji Türü', '__fuel__'],
      ['Vites Tipi', 'Vites Tipi'],

      { section: 'Performans' },
      ['Sistem Gücü', 'Sistem Gücü'],
      ['Sistem Torku', 'Sistem Torku'],
      ['0-100 Hızlanma', '0-100 Hızlanma'],
      ['Maksimum Hız', 'Maksimum Hız'],
      ['Silindir Hacmi', 'Silindir Hacmi'],
      ['Motor Gücü', 'Motor Gücü'],

      { section: 'Ekonomi / Enerji' },
      ['Ortalama Tüketim', 'Ortalama Tüketim'],
      ['Ortalama Menzil', 'Ortalama Menzil'],
      ['KM Başı Maliyet', 'KM Başı Maliyet'],
      ['Enerji Tüketimi', 'Enerji Tüketimi'],
      ['Batarya Hacmi', 'Batarya Hacmi'],
      ['Şarj Süresi', 'Şarj Süresi'],
      ['Yakıt Deposu', 'Yakıt Deposu'],

      { section: 'Boyut / Pratiklik' },
      ['Bagaj Hacmi', 'Bagaj Hacmi'],
      ['Boş Ağırlık', 'Boş Ağırlık'],
      ['Uzunluk', 'Uzunluk'],
      ['Genişlik', 'Genişlik'],
      ['Yükseklik', 'Yükseklik']
    ];

    let table = '<div class="compare-table-wrap"><table class="compare-table"><thead><tr>';
    table += '<th>Özellik</th>';

    compareSelection.forEach(item => {
      const img = item.model.thumbnail
        ? getImgUrl(item.model.thumbnail)
        : '';

      table += `<th>
        ${img ? `<img class="compare-car-image" src="${img}" alt="">` : ''}
        <div>${escapeHtml(item.brand.name)} ${escapeHtml(item.model.name)}</div>
        <small>${escapeHtml(item.version.name || '')}</small>
      </th>`;
    });

    table += '</tr></thead><tbody>';

    rows.forEach(row => {
      if (row.section) {
        table += `<tr class="compare-section-row">
          <td colspan="${compareSelection.length + 1}">${escapeHtml(row.section)}</td>
        </tr>`;
        return;
      }

      const [label, key] = row;
      const values = compareSelection.map(item => valueOf(item, key));

      // Tamamı boş/— ise gereksiz satırı göstermiyoruz.
      if (values.every(v => v === '—' || v === '' || v == null)) return;

      table += `<tr><td>${escapeHtml(label)}</td>`;

      values.forEach(value => {
        table += `<td>${escapeHtml(value)}</td>`;
      });

      table += '</tr>';
    });

    table += '</tbody></table></div>';

    $('#compare-content').innerHTML = table;
    $('#compare-modal').classList.add('active');
  }

  async function closeCompareModal() {
    $('#compare-modal').classList.remove('active');
    await exitCompareLandscape();
  }

  const versionModalEl = $('#version-modal');
  $('#compare-modal-close').addEventListener('click', closeCompareModal);

  // Normal click: masaüstü ve çoğu WebView için ana yol.
  versionModalEl.addEventListener('click', e => {
    if (e.target.closest?.('#version-modal-close')) {
      e.preventDefault();
      e.stopPropagation();
      closeVersionModal();
      return;
    }
    const option = e.target.closest?.('.version-option');
    if (option) {
      activateVersionOption(option, e);
      return;
    }
    if (e.target === versionModalEl) closeVersionModal();
  }, true);

  // Pointer fallback. Scroll hareketi seçim sayılmasın diye başlangıç/bitiş mesafesini kontrol et.
  versionModalEl.addEventListener('pointerdown', e => {
    if (!e.target.closest?.('.version-option')) return;
    versionTouchStart = { x: e.clientX, y: e.clientY, id: e.pointerId };
  }, true);

  versionModalEl.addEventListener('pointerup', e => {
    const option = e.target.closest?.('.version-option');
    if (!option || !versionTouchStart) return;
    const dx = Math.abs(e.clientX - versionTouchStart.x);
    const dy = Math.abs(e.clientY - versionTouchStart.y);
    versionTouchStart = null;
    if (dx <= 12 && dy <= 12) activateVersionOption(option, e);
  }, true);

  versionModalEl.addEventListener('pointercancel', () => {
    versionTouchStart = null;
  }, true);

  // Eski/uyumsuz Android WebView fallback: touchend koordinatından hedefi yeniden bul.
  versionModalEl.addEventListener('touchstart', e => {
    const t = e.touches?.[0];
    if (!t || !e.target.closest?.('.version-option')) return;
    versionTouchStart = { x: t.clientX, y: t.clientY, id: 'touch' };
  }, { capture: true, passive: true });

  versionModalEl.addEventListener('touchend', e => {
    const t = e.changedTouches?.[0];
    if (!t || !versionTouchStart) return;
    const dx = Math.abs(t.clientX - versionTouchStart.x);
    const dy = Math.abs(t.clientY - versionTouchStart.y);
    versionTouchStart = null;
    if (dx > 12 || dy > 12) return;
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const option = el?.closest?.('.version-option');
    if (option && versionModalEl.contains(option)) activateVersionOption(option, e);
  }, { capture: true, passive: false });

  // Modal açıkken WebView görünürlük/focus değişimlerinde touch state'i kendi kendine toparlasın.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) setTimeout(recoverVersionModalState, 30);
  });
  window.addEventListener('focus', recoverVersionModalState);
  window.addEventListener('pageshow', recoverVersionModalState);

  $('#compare-modal').addEventListener('click', e => {
    if (e.target.id === 'compare-modal') closeCompareModal();
  });

  $('#compare-clear').addEventListener('click', () => {
    compareSelection = [];
    refreshCompareUI();
  });

  // Android WebView için dayanıklı karşılaştırma açma sistemi.
  // Listener yalnız butona bağlı değil: document capture seviyesinde de yakalanır.
  // Böylece WebView sabit katmanda hedefi kısa süreli kaybetse bile işlem çalışır.
  const compareStartBtn = $('#compare-start');
  let compareOpening = false;
  let lastCompareActivation = 0;

  function recoverCompareTouchState() {
    const tray = $('#compare-tray');
    const modal = $('#compare-modal');

    if (tray) {
      tray.style.pointerEvents = 'auto';
      tray.style.transform = 'translateZ(0)';
      tray.style.webkitTransform = 'translateZ(0)';
    }

    if (compareStartBtn) {
      compareStartBtn.style.pointerEvents = 'auto';
      compareStartBtn.disabled = compareSelection.length < 2;
    }

    // Görünmeyen modallar dokunmayı asla tutmasın.
    document.querySelectorAll('.app-modal:not(.active)').forEach(el => {
      el.style.pointerEvents = 'none';
    });

    if (modal?.classList.contains('active')) {
      modal.style.pointerEvents = 'auto';
    }
  }

  async function safeOpenCompare(e) {
    const now = Date.now();
    if (now - lastCompareActivation < 450) return;
    if (compareOpening || compareSelection.length < 2) return;

    if (e?.cancelable) e.preventDefault();
    if (e) e.stopPropagation();

    lastCompareActivation = now;
    compareOpening = true;
    recoverCompareTouchState();

    try {
      await openCompareModal();
    } catch (err) {
      console.error('Karşılaştırma açılamadı:', err);

  }

  // Capture listener: normal click listener kaybolsa/yutulsa bile üst seviyede yakala.
  document.addEventListener('click', e => {
    const target = e.target?.closest?.('#compare-start');

  }, true);

  // Android WebView fallback: parmak kaldırıldığında koordinattan butonu tekrar doğrula.

    if (!document.hidden) setTimeout(recoverCompareTouchState, 50);
  });

  window.addEventListener('focus', recoverCompareTouchState);

  // Seçim değiştikçe de state'i doğrula.
  setInterval(() => {
    if ($('#version-modal')?.classList.contains('active')) {
      recoverVersionModalState();
    } else if (compareSelection.length > 0) {
      recoverCompareTouchState();
    }
  }, 2000);

  $('#compare-orientation-btn').addEventListener(
    'click',
    toggleCompareOrientation
  );

  // ===== LIGHTBOX =====
  let total = 0;
  function openLightbox(images) {

    const frag = document.createDocumentFragment();
    images.forEach((url, i) => {
      const page = document.createElement('div'); page.className = 'page'; page.dataset.index = i;
      const pz = document.createElement('div'); pz.className = 'pz';
      const stage = document.createElement('div'); stage.className = 'stage';
      const sk = document.createElement('div'); sk.className = 'skel';

  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    const img = page.querySelector('.img'), sk = page.querySelector('.skel');
    if (img.dataset.loaded) return;
    const src = img.getAttribute('data-src');
    img.onload = () => { sk && sk.remove(); img.classList.add('ready'); };
    img.onerror = () => { sk && sk.remove(); img.alt = 'Görüntü yüklenemedi'; img.classList.add('ready'); };
    img.src = src; img.dataset.loaded = '1';

  function currentIndex() { const w = viewer.clientWidth || 1; return Math.round(viewer.scrollLeft / w); }
  function updateVisible() {
    const idx = currentIndex(); loadImageAt(idx); loadImageAt(idx-1); loadImageAt(idx+1);
    counter.textContent = `${idx+1} / ${total}`;
    btnPrev.style.display = (idx === 0) ? 'none' : 'flex';
    btnNext.style.display = (idx === total-1) ? 'none' : 'flex';
  }

  let snapTimer;
  viewer.addEventListener('scroll', () => {
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => { const w = viewer.clientWidth; const target = Math.round(viewer.scrollLeft / w) * w; viewer.scrollTo({ left: target, behavior: 'smooth' }); updateVisible(); }, 80);
  });

  function go(delta) {

    viewer.scrollTo({ left: targetIdx * w, behavior: 'smooth' });
    loadImageAt(targetIdx); loadImageAt(targetIdx-1); loadImageAt(targetIdx+1);
    counter.textContent = `${targetIdx+1} / ${total}`;
    btnPrev.style.display = (targetIdx === 0) ? 'none' : 'flex';
    btnNext.style.display = (targetIdx === total-1) ? 'none' : 'flex';
    resetAllZoom();
  }
  btnPrev.addEventListener('click', () => go(-1));
  btnNext.addEventListener('click', () => go(1));
  btnClose.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', e => { if (!lightbox.classList.contains('active')) return; if (e.key==='ArrowLeft') go(-1); if (e.key==='ArrowRight') go(1); if (e.key==='Escape') closeLightbox(); });

  function resetAllZoom() {
    document.querySelectorAll('.pz').forEach(pz => {
      const stage = pz.querySelector('.stage');
      if (stage && stage._zoomState) { const st = stage._zoomState; st.scale = 1; st.tx = 0; st.ty = 0; st.targetTransform = 'translate(0px,0px) scale(1)'; stage.style.transform = st.targetTransform; pz.style.touchAction = 'pan-x pan-y'; }
    });
  }

    container.addEventListener("pointercancel", endPointer);
    container.addEventListener("pointerleave", endPointer);
    container.addEventListener('dblclick', e => { zoomAt(e.clientX, e.clientY, (state.scale > 1.1) ? 1 : 2.5); });
  }

  document.addEventListener('DOMContentLoaded', loadData);
})();
