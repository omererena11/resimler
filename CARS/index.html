<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=no"/>
<meta name="referrer" content="no-referrer"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Otomobil Uygulaması</title>
<style>
  :root {
    --bg-color: #F5F5F5;
    --card-width: 272px;
    --card-img-h: 230px;
    --card-bg: #FFFFFF;
    --card-radius: 12px;
    --card-gap: 7px;
    --section-gap: 12px;
    --text-primary: #1A1C1E;
    --text-secondary: #5F6B7A;
    --accent: #2563EB;
    --highlight-bg: #F0F6FF;
    /* Marka başlığı global değişkenleri */
    --brand-logo-size: 32px;
    --brand-title-size: 18px;
    --brand-title-font: 'Arial';
    --brand-title-weight: bold;
    --brand-title-color: #1A1C1E;
    --brand-logo-gap: 8px;
    --brand-header-height: 40px;
    --brand-header-align: left;
    /* Marka listesi değişkenleri */
    --brand-logo-w: 64px;
    --brand-logo-h: 64px;
    --brand-name-size: 1.1rem;
    --brand-name-font: 'Arial';
    --brand-name-color: #1A1C1E;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-color);
    color: var(--text-primary);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  #app { max-width: 100%; margin: 0 auto; }

  #top-filters {
    background: #1A1C1E;
    padding: 6px 12px;
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .cat-select {
    background: #2A2C30;
    color: #fff;
    border: 1px solid #3A3C40;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
    min-width: 110px;
  }

  #filter-nav {
    background: white;
    padding: 6px 0 2px 0;
    border-bottom: 1px solid #E8EAED;
    position: sticky;
    top: 42px;
    z-index: 9;
  }
  .filter-container {
    display: flex; overflow-x: auto; gap: 8px; padding: 0 16px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .filter-container::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
    border: 1px solid #DDE1E6; background: white; color: var(--text-primary);
    font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-btn.all-btn {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    font-weight: 600;
  }
  .filter-btn.all-btn.active {
    background: #1d4ed8;
    border-color: #1d4ed8;
  }
  .filter-btn:not(.all-btn).active {
    background: #EFF6FF;
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  #brand-search-wrapper {
    position: relative;
    margin: 8px 16px 4px 16px;
  }
  #brand-search {
    width: 100%;
    height: 44px;
    padding: 0 40px 0 40px;
    border: 1px solid #DDE1E6;
    border-radius: 22px;
    font-size: 15px;
    background: #F8FAFC;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
  }
  #brand-search:focus {
    border-color: var(--accent);
    background: white;
  }
  .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: #8E98A3;
    font-size: 18px;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: #E8EAED;
    color: #5F6B7A;
    font-size: 16px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .search-clear.visible { display: flex; }

  #brand-search-results {
    display: none;
    position: absolute;
    top: 50px;
    left: 0; right: 0;
    background: white;
    border: 1px solid #E8EAED;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    z-index: 20;
    overflow: hidden;
  }
  #brand-search-results.visible { display: block; }
  .search-result-item {
    padding: 12px 16px;
    cursor: pointer;
    font-size: 15px;
    border-bottom: 1px solid #F0F2F5;
    transition: background 0.15s;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: #F8FAFC; }
  .search-result-empty {
    padding: 14px 16px;
    color: #8E98A3;
    font-size: 14px;
    text-align: center;
  }

  main { padding: 0; }

  .brand-section {
    background: #FFFFFF;
    margin: 0 0 var(--section-gap) 0;
    padding-bottom: 6px;
    position: relative;
  }
  .brand-section::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.04), transparent);
    pointer-events: none; z-index: 2;
  }
  .brand-section::after {
    content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.04), transparent);
    pointer-events: none; z-index: 2;
  }

  .brand-header {
    display: flex;
    align-items: center;
    padding: 12px 20px 4px;
    height: var(--brand-header-height, 40px);
    gap: var(--brand-logo-gap, 8px);
    justify-content: var(--brand-header-align, left);
  }
  .brand-logo {
    width: var(--brand-logo-size, 32px);
    height: var(--brand-logo-size, 32px);
    border-radius: 50%;
    background: #F0F2F5;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .brand-logo img { max-width: 80%; max-height: 80%; object-fit: contain; }
  .brand-name {
    font-size: var(--brand-title-size, 18px);
    font-family: var(--brand-title-font, 'Arial');
    font-weight: var(--brand-title-weight, bold);
    color: var(--brand-title-color, #1A1C1E);
  }

  .brand-highlight {
    margin: 4px 20px 8px;
    padding: 10px 14px;
    background: var(--highlight-bg);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .brand-highlight .text { flex: 1; }

  .brand-highlight.marquee .text { white-space: nowrap; animation: marquee 12s linear infinite; }
  @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
  .brand-highlight.shimmer {
    background: linear-gradient(90deg, #f0f6ff 25%, #e0ecff 50%, #f0f6ff 75%) !important;
    background-size: 200% 100% !important;
    animation: shimmer 2.5s infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .brand-highlight.pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  .brand-highlight.glow { animation: glow 1.5s infinite alternate; }
  @keyframes glow { 0% { box-shadow: 0 0 5px rgba(37,99,235,0.4); } 100% { box-shadow: 0 0 20px rgba(37,99,235,0.8); } }
  .brand-highlight.slide-up .text { animation: slideUp 4s infinite; }
  @keyframes slideUp { 0% { transform: translateY(100%); opacity:0; } 10% { transform: translateY(0); opacity:1; } 90% { transform: translateY(0); opacity:1; } 100% { transform: translateY(-100%); opacity:0; } }
  .brand-highlight.typewriter .text { overflow: hidden; white-space: nowrap; border-right: 2px solid var(--accent); animation: typing 3s steps(30, end), blink-caret 0.75s step-end infinite; }
  @keyframes typing { from { width: 0; } to { width: 100%; } }
  @keyframes blink-caret { from,to { border-color: transparent; } 50% { border-color: var(--accent); } }
  .brand-highlight.border-pulse { animation: borderPulse 2s infinite; }
  @keyframes borderPulse { 0% { border-left-color: var(--accent); } 50% { border-left-color: #60a5fa; } 100% { border-left-color: var(--accent); } }
  .brand-highlight.shake { animation: shake 0.5s infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .brand-highlight.fade-in { animation: fadeIn 2s ease-in-out; }
  @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

  .models-row { display: flex; overflow-x: auto; gap: var(--card-gap); padding: 8px 16px 12px; scrollbar-width: none; }
  .models-row::-webkit-scrollbar { display: none; }

  .model-card {
    flex-shrink: 0; width: var(--card-width); background: var(--card-bg);
    border-radius: var(--card-radius); overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #E8EAED;
    cursor: pointer; transition: transform 0.2s;
  }
  .model-card:active { transform: scale(0.97); }
  .model-card img { width: 100%; height: var(--card-img-h); object-fit: cover; background: #F0F1F3; display: block; }
  .model-info { padding: 10px 14px; }
  .model-name { font-weight: 600; font-size: 0.95rem; }
  .model-year { color: var(--text-secondary); font-size: 0.8rem; margin-top: 2px; }
  .model-desc {
    color: var(--accent); font-size: 0.78rem; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; margin-top: 4px; font-weight: 500;
  }
  .placeholder-img { background: #F0F1F3; display: flex; align-items: center; justify-content: center; height: var(--card-img-h); font-size: 2.5rem; color: #ADB5BD; }
  .empty-state, .loading { text-align: center; padding: 40px; color: #8E98A3; }

  #lightbox {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.22s ease;
  }
  #lightbox.active { opacity: 1; pointer-events: auto; }

  #viewer {
    display: flex; width: 100%; height: 100%;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    position: absolute; top: 0; left: 0;
  }
  #viewer.lock { scroll-snap-type: none; }

  .page { min-width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; scroll-snap-align: start; scroll-snap-stop: always; position: relative; overflow: hidden; }
  .pz { width: 100%; height: 100%; position: relative; touch-action: pan-x pan-y; }
  .stage { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; backface-visibility: hidden; }
  .img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: transparent; opacity: 0; transition: opacity 0.18s ease; -webkit-user-drag: none; user-select: none; pointer-events: auto; }
  .img.ready { opacity: 1; }
  .skel { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #1a1a1a 0 20%, #0a0a0a 60%); animation: pulse-skel 1.2s ease-in-out infinite; }
  @keyframes pulse-skel { 50% { filter: brightness(1.15); } }

  #counter { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 10; background: rgba(0,0,0,0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: 500; pointer-events: none; }
  .navbtn { position: fixed; top: 50%; transform: translateY(-50%); width: 42px; height: 64px; z-index: 11; border: none; border-radius: 12px; background: rgba(0,0,0,0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #ddd; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #prev { left: 8px; display: none; } #next { right: 8px; }
  .closebtn { position: fixed; top: 18px; right: 18px; z-index: 12; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: none; color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>
</head>
<body>
  <div id="app">
    <div id="top-filters">
      <select id="filter-body-type" class="cat-select">
        <option value="">Kasa Tipi</option>
        <option value="cabrio">Cabrio</option>
        <option value="coupe">Coupe</option>
        <option value="coupe_4">Coupe 4 kapı</option>
        <option value="hatchback_3">Hatchback 3 kapı</option>
        <option value="hatchback_5">Hatchback 5 kapı</option>
        <option value="sedan">Sedan</option>
        <option value="station_wagon">Station Wagon</option>
        <option value="mpv">MPV</option>
        <option value="roadster">Roadster</option>
        <option value="suv">SUV</option>
      </select>
      <select id="filter-fuel-type" class="cat-select">
        <option value="">Yakıt Tipi</option>
        <option value="benzin">Benzin</option>
        <option value="dizel">Dizel</option>
        <option value="hibrit">Hibrit</option>
        <option value="elektrik">Elektrik</option>
        <option value="lpg">LPG</option>
      </select>
    </div>

    <nav id="filter-nav">
      <div class="filter-container" id="filter-container"></div>
      <div id="brand-search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="brand-search" placeholder="Marka ara..." autocomplete="off"/>
        <button class="search-clear" id="search-clear">&times;</button>
        <div id="brand-search-results"></div>
      </div>
    </nav>

    <main id="content"><div class="loading">Veriler yükleniyor...</div></main>
  </div>

  <div id="lightbox">
    <button class="closebtn" id="lightbox-close">&times;</button>
    <div id="viewer"></div>
    <button id="prev" class="navbtn">‹</button>
    <button id="next" class="navbtn">›</button>
    <div id="counter">1 / 1</div>
  </div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const lightbox = $('#lightbox'), viewer = $('#viewer'), counter = $('#counter');
  const btnPrev = $('#prev'), btnNext = $('#next'), btnClose = $('#lightbox-close');

  const GITHUB_RAW = 'https://raw.githubusercontent.com/omererena11/otomobil-verileri/main';
  const BASE_PATH = GITHUB_RAW + '/';
  const DATA_URL = BASE_PATH + 'data.json?t=' + Date.now();

  let appData = null, activeFilter = null;
  let filterBodyType = '', filterFuelType = '';

  function getImgUrl(path) { if (!path) return ''; return path.startsWith('http') ? path : BASE_PATH + path; }

  async function loadData() {
    const content = $('#content'); content.innerHTML = '<div class="loading">Veriler yükleniyor...</div>';
    try {
      const resp = await fetch(DATA_URL, { cache: 'no-store' });
      if (!resp.ok) throw new Error('Veri alınamadı');
      appData = await resp.json();
      applySettings(appData.home_page_settings);
      renderFilters();
      renderContent();
      initSearch();
      bindFilters();
    } catch (e) { content.innerHTML = '<div class="empty-state">Hata oluştu: ' + e.message + '</div>'; }
  }

  function applySettings(s) {
    if (!s) return;
    const r = document.documentElement.style;
    if (s.card) {
      const baseW = (s.card.width || 170) * 1.6;
      r.setProperty('--card-width', baseW + 'px');
      r.setProperty('--card-img-h', Math.round(baseW * 27 / 32) + 'px');
    }
    if (s.carousel) r.setProperty('--card-gap', Math.round((s.carousel.gap||12) * 0.5) + 'px');
    if (s.sections) r.setProperty('--section-gap', Math.max(8, (s.sections.vertical_gap||20) / 4) + 'px');

    // Marka başlığı global ayarları
    if (s.brand_header_settings) {
      const h = s.brand_header_settings;
      r.setProperty('--brand-logo-size', (h.logo_size || 32) + 'px');
      r.setProperty('--brand-title-size', (h.title_font_size || 18) + 'px');
      r.setProperty('--brand-title-font', h.title_font_family || 'Arial');
      r.setProperty('--brand-title-weight', h.title_font_weight || 'bold');
      r.setProperty('--brand-title-color', h.title_color || '#1A1C1E');
      r.setProperty('--brand-logo-gap', (h.logo_title_gap || 8) + 'px');
      r.setProperty('--brand-header-height', (h.header_height || 40) + 'px');
      r.setProperty('--brand-header-align', h.alignment || 'left');
    }

    // Marka listesi stilleri
    if (s.brand_list_style) {
      const ls = s.brand_list_style;
      r.setProperty('--brand-logo-w', (ls.logo_width || 50) + 'px');
      r.setProperty('--brand-logo-h', (ls.logo_height || 50) + 'px');
      r.setProperty('--brand-name-size', (ls.font_size || 11) + 'px');
      r.setProperty('--brand-name-font', ls.font_family || 'Segoe UI');
      r.setProperty('--brand-name-color', ls.font_color || '#000000');
    }
  }

  function bindFilters() {
    $('#filter-body-type').addEventListener('change', e => { filterBodyType = e.target.value; renderContent(); });
    $('#filter-fuel-type').addEventListener('change', e => { filterFuelType = e.target.value; renderContent(); });
  }

  function selectBrand(brandId) {
    activeFilter = brandId; renderFilters(); renderContent();
    const si = $('#brand-search'); if (si) { si.value = ''; hideSearchResults(); updateClearButton(); }
  }

  function renderFilters() {
    const c = $('#filter-container'); c.innerHTML = '';
    if (!appData?.brands) return;
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn all-btn' + (!activeFilter ? ' active' : '');
    allBtn.textContent = 'TÜMÜ'; allBtn.onclick = () => selectBrand(null);
    c.appendChild(allBtn);
    appData.brands.sort((a,b)=>a.order-b.order).forEach(b => {
      if (!b.show_on_homepage) return;
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (activeFilter === b.id ? ' active' : '');
      btn.textContent = b.name; btn.onclick = () => selectBrand(b.id);
      c.appendChild(btn);
    });
  }

  function initSearch() {
    const si = $('#brand-search'), sc = $('#search-clear');
    si.addEventListener('input', () => {
      const q = si.value.trim().toLowerCase(); updateClearButton();
      if (!q) { hideSearchResults(); return; }
      const filtered = (appData.brands || []).filter(b => b.show_on_homepage && b.name.toLowerCase().includes(q));
      showSearchResults(filtered);
    });
    sc.addEventListener('click', () => { si.value = ''; updateClearButton(); hideSearchResults(); si.focus(); });
    document.addEventListener('click', e => { if (!e.target.closest('#brand-search-wrapper')) hideSearchResults(); });
  }
  function updateClearButton() { $('#search-clear').classList.toggle('visible', !!$('#brand-search').value.trim()); }
  function showSearchResults(brands) {
    const c = $('#brand-search-results'); c.innerHTML = '';
    if (!brands.length) { c.innerHTML = '<div class="search-result-empty">Marka bulunamadı</div>'; }
    else { brands.slice(0,6).forEach(b => { const item = document.createElement('div'); item.className='search-result-item'; item.textContent=b.name; item.addEventListener('click',()=>selectBrand(b.id)); c.appendChild(item); }); }
    c.classList.add('visible');
  }
  function hideSearchResults() { $('#brand-search-results').classList.remove('visible'); }

  function matchesFilters(car) {
    if (filterBodyType && (!car.body_types || !car.body_types.includes(filterBodyType))) return false;
    if (filterFuelType && (!car.fuel_types || !car.fuel_types.includes(filterFuelType))) return false;
    return true;
  }

  function renderContent() {
    const content = $('#content');
    if (!appData?.brands) { content.innerHTML = '<div class="empty-state">Veri yok</div>'; return; }
    let html = '';
    appData.brands.sort((a,b)=>a.order-b.order).forEach(brand => {
      if (!brand.show_on_homepage || (activeFilter && brand.id !== activeFilter)) return;
      let models = (brand.models||[]).filter(m => m.show_on_homepage && matchesFilters(m));
      if (!models.length) return;
      models.sort((a,b) => (a.order||1) - (b.order||1));

      html += `<section class="brand-section">
        <div class="brand-header">
          <div class="brand-logo">${brand.logo ? `<img src="${getImgUrl(brand.logo)}" onerror="this.parentElement.innerHTML='🏢'">` : '🏢'}</div>
          <span class="brand-name">${brand.name}</span>
        </div>`;
      if (brand.show_brand_description && brand.brand_description) {
        const style = brand.brand_description_style || {}; const effect = style.effect || 'none'; const effectClass = effect !== 'none' ? ' ' + effect : '';
        html += `<div class="brand-highlight${effectClass}" style="font-family:${style.font_family||'Arial'};font-size:${style.font_size||14}px;font-weight:${style.font_weight||'normal'};color:${style.color||'#1A1C1E'};text-align:${style.text_align||'left'};"><span class="text">${brand.brand_description}</span></div>`;
      }
      html += '<div class="models-row">';
      models.forEach(car => {
        const thumb = car.thumbnail ? getImgUrl(car.thumbnail) : '';
        const largeImages = (car.large_images?.length ? car.large_images : (car.thumbnail ? [car.thumbnail] : [])).map(getImgUrl);
        html += `<div class="model-card" data-images='${JSON.stringify(largeImages)}'>${thumb ? `<img src="${thumb}" alt="${car.name}" loading="lazy" onerror="this.parentElement.querySelector('.placeholder-img').style.display='flex'; this.style.display='none';">` : ''}<div class="placeholder-img" style="display:${thumb?'none':'flex'};">🚗</div><div class="model-info"><div class="model-name">${car.name}</div>${car.show_year?`<div class="model-year">${car.year}</div>`:''}${car.show_description&&car.card_description?`<div class="model-desc">✨ ${car.card_description}</div>`:''}</div></div>`;
      });
      html += '</div></section>';
    });
    content.innerHTML = html || '<div class="empty-state">Model bulunamadı</div>';
    document.querySelectorAll('.model-card').forEach(card => {
      card.addEventListener('click', () => { const imgs = JSON.parse(card.dataset.images); if (imgs?.length) openLightbox(imgs); });
    });
  }

  // ===== LIGHTBOX =====
  let total = 0;
  function openLightbox(images) {
    viewer.innerHTML = ''; total = images.length;
    const frag = document.createDocumentFragment();
    images.forEach((url, i) => {
      const page = document.createElement('div'); page.className = 'page'; page.dataset.index = i;
      const pz = document.createElement('div'); pz.className = 'pz';
      const stage = document.createElement('div'); stage.className = 'stage';
      const sk = document.createElement('div'); sk.className = 'skel';
      const img = document.createElement('img'); img.className = 'img'; img.setAttribute('data-src', url);
      stage.appendChild(img); pz.appendChild(sk); pz.appendChild(stage); page.appendChild(pz);
      attachZoomPan(pz, stage); frag.appendChild(page);
    });
    viewer.appendChild(frag);
    lightbox.classList.add('active'); document.body.style.overflow = 'hidden';
    history.pushState({ lightboxOpen: true }, '');
    loadImageAt(0); loadImageAt(1); loadImageAt(total-1); updateVisible(); viewer.scrollLeft = 0; resetAllZoom();
  }
  function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; viewer.innerHTML = ''; if (history.state?.lightboxOpen) history.back(); }
  window.addEventListener('popstate', e => { if (lightbox.classList.contains('active')) { closeLightbox(); e.preventDefault(); } });
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

  function loadImageAt(index) {
    if (index < 0 || index >= total) return;
    const page = viewer.querySelector(`.page[data-index="${index}"]`); if (!page) return;
    const img = page.querySelector('.img'), sk = page.querySelector('.skel');
    if (img.dataset.loaded) return;
    const src = img.getAttribute('data-src');
    img.onload = () => { sk && sk.remove(); img.classList.add('ready'); };
    img.onerror = () => { sk && sk.remove(); img.alt = 'Görüntü yüklenemedi'; img.classList.add('ready'); };
    img.src = src; img.dataset.loaded = '1';
  }

  function currentIndex() { const w = viewer.clientWidth || 1; return Math.round(viewer.scrollLeft / w); }
  function updateVisible() {
    const idx = currentIndex(); loadImageAt(idx); loadImageAt(idx-1); loadImageAt(idx+1);
    counter.textContent = `${idx+1} / ${total}`;
    btnPrev.style.display = (idx === 0) ? 'none' : 'flex';
    btnNext.style.display = (idx === total-1) ? 'none' : 'flex';
  }

  let snapTimer;
  viewer.addEventListener('scroll', () => {
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => { const w = viewer.clientWidth; const target = Math.round(viewer.scrollLeft / w) * w; viewer.scrollTo({ left: target, behavior: 'smooth' }); updateVisible(); }, 80);
  });

  function go(delta) {
    const w = viewer.clientWidth, idx = currentIndex(), targetIdx = Math.max(0, Math.min(total-1, idx + delta));
    viewer.scrollTo({ left: targetIdx * w, behavior: 'smooth' });
    loadImageAt(targetIdx); loadImageAt(targetIdx-1); loadImageAt(targetIdx+1);
    counter.textContent = `${targetIdx+1} / ${total}`;
    btnPrev.style.display = (targetIdx === 0) ? 'none' : 'flex';
    btnNext.style.display = (targetIdx === total-1) ? 'none' : 'flex';
    resetAllZoom();
  }
  btnPrev.addEventListener('click', () => go(-1));
  btnNext.addEventListener('click', () => go(1));
  btnClose.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', e => { if (!lightbox.classList.contains('active')) return; if (e.key==='ArrowLeft') go(-1); if (e.key==='ArrowRight') go(1); if (e.key==='Escape') closeLightbox(); });

  function resetAllZoom() {
    document.querySelectorAll('.pz').forEach(pz => {
      const stage = pz.querySelector('.stage');
      if (stage && stage._zoomState) { const st = stage._zoomState; st.scale = 1; st.tx = 0; st.ty = 0; st.targetTransform = 'translate(0px,0px) scale(1)'; stage.style.transform = st.targetTransform; pz.style.touchAction = 'pan-x pan-y'; }
    });
  }

  function attachZoomPan(container, stage) {
    const state = { scale: 1, min: 1, max: 4, tx: 0, ty: 0, dragging: false, lx:0, ly:0, rafPending:false, targetTransform:"" };
    stage._zoomState = state;
    const PINCH_START_THRESHOLD_PX = 10, WHEEL_SENS = 0.0011; let lastTapTime = 0;

    function perfLock(on) {
      if (on) { viewer.classList.add("lock"); viewer.style.webkitOverflowScrolling = "auto"; viewer.style.scrollBehavior = "auto"; container.style.touchAction = "none"; }
      else { viewer.classList.remove("lock"); viewer.style.webkitOverflowScrolling = "touch"; viewer.style.scrollBehavior = "smooth"; container.style.touchAction = "pan-x pan-y"; }
    }
    function schedule() { if (state.rafPending) return; state.rafPending = true; requestAnimationFrame(() => { stage.style.transform = state.targetTransform; state.rafPending = false; }); }
    function compose() { return `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`; }

    function clampPan() {
      const cw = container.clientWidth, ch = container.clientHeight, exX = cw * state.scale - cw, exY = ch * state.scale - ch;
      state.tx = Math.max(-Math.max(0, exX), Math.min(Math.max(0, exX), state.tx));
      state.ty = Math.max(-Math.max(0, exY), Math.min(Math.max(0, exY), state.ty));
      state.targetTransform = compose(); schedule();
    }

    function zoomAt(clientX, clientY, nextScale) {
      nextScale = Math.max(state.min, Math.min(state.max, nextScale)); const prev = state.scale;
      if (Math.abs(nextScale - prev) < 1e-6) return;
      const rect = container.getBoundingClientRect(), cx = clientX - rect.left, cy = clientY - rect.top;
      const wx = (cx - state.tx) / prev, wy = (cy - state.ty) / prev;
      state.scale = nextScale; state.tx = cx - wx * nextScale; state.ty = cy - wy * nextScale;
      clampPan(); perfLock(state.scale > 1.0001);
    }

    container.addEventListener("wheel", e => { e.preventDefault(); const factor = Math.exp(-e.deltaY * WHEEL_SENS); zoomAt(e.clientX, e.clientY, state.scale * factor); }, { passive: false });

    let p1 = null, p2 = null, pinchActive = false, pinchStartDist = 0, pinchStartScale = 1;
    container.addEventListener("pointerdown", e => {
      container.setPointerCapture(e.pointerId);
      if (!p1) p1 = { id: e.pointerId, x: e.clientX, y: e.clientY };
      else if (!p2 && e.pointerId !== p1.id) p2 = { id: e.pointerId, x: e.clientX, y: e.clientY };
      const now = Date.now();
      if (e.pointerType === 'touch' && !p2 && state.scale <= 1.0001) { if (now - lastTapTime < 300) { zoomAt(e.clientX, e.clientY, (state.scale > 1.1) ? 1 : 2.5); lastTapTime = 0; return; } lastTapTime = now; }
      if (!p2 && state.scale > 1) { state.dragging = true; state.lx = e.clientX; state.ly = e.clientY; perfLock(true); }
      if (p1 && p2) { pinchActive = false; pinchStartDist = Math.hypot(p2.x - p1.x, p2.y - p1.y); pinchStartScale = state.scale; perfLock(true); }
    });
    container.addEventListener("pointermove", e => {
      if (p1 && e.pointerId === p1.id) { p1.x = e.clientX; p1.y = e.clientY; }
      if (p2 && e.pointerId === p2.id) { p2.x = e.clientX; p2.y = e.clientY; }
      if (p1 && p2) { e.preventDefault(); const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y); if (!pinchActive) { if (Math.abs(dist - pinchStartDist) < PINCH_START_THRESHOLD_PX) return; pinchActive = true; pinchStartDist = dist; pinchStartScale = state.scale; } zoomAt((p1.x+p2.x)/2, (p1.y+p2.y)/2, pinchStartScale * (dist / (pinchStartDist || 1))); return; }
      if (state.dragging && state.scale > 1) { e.preventDefault(); const dx = e.clientX - state.lx, dy = e.clientY - state.ly; state.lx = e.clientX; state.ly = e.clientY; state.tx += dx; state.ty += dy; clampPan(); }
    }, { passive: false });
    function endPointer(e) { if (p1 && e.pointerId === p1.id) p1 = null; if (p2 && e.pointerId === p2.id) p2 = null; if (!(p1 && p2)) pinchActive = false; if (!p1 && !p2) { state.dragging = false; if (state.scale <= 1.0001) { state.scale = 1; state.tx = 0; state.ty = 0; state.targetTransform = 'translate(0px,0px) scale(1)'; schedule(); perfLock(false); } else perfLock(true); } }
    container.addEventListener("pointerup", endPointer);
    container.addEventListener("pointercancel", endPointer);
    container.addEventListener("pointerleave", endPointer);
    container.addEventListener('dblclick', e => { zoomAt(e.clientX, e.clientY, (state.scale > 1.1) ? 1 : 2.5); });
  }

  document.addEventListener('DOMContentLoaded', loadData);
})();
</script>
</body>
</html>
