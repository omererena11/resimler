<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Otomobil Uygulaması</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Üst başlık -->
        <header>
            <h1>TÜM OTOMOBİLLER</h1>
        </header>

        <!-- Marka logoları (yatay kaydırma) -->
        <nav id="brands-nav">
            <div class="brands-container" id="brands-container">
                <!-- Dinamik olarak doldurulacak -->
            </div>
        </nav>

        <!-- Ana içerik (modeller) -->
        <main id="content">
            <!-- Dinamik olarak doldurulacak -->
        </main>
    </div>

    <!-- Lightbox (tam ekran slider) -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <span class="nav-btn prev-btn">&lsaquo;</span>
        <span class="nav-btn next-btn">&rsaquo;</span>
        <div class="lightbox-content" id="lightbox-content">
            <!-- Slider görselleri burada oluşturulacak -->
        </div>
        <div class="image-counter" id="image-counter">1 / 5</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
